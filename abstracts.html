e flippases ATP8B1 are associated with progressive familial intrahepatic cholestasis. Despite their importance, the precise molecular mechanisms behind flippase activation and their roles in disease remain poorly understood. Here, we report progress made toward elucidating the post-translational modifications and protein partners regulating ATP8B1. Previous work has revealed key insights into ATP8B1 regulation, including a strict autoinhibition mechanism mediated by its N- and C-terminal tails, which lock the flippase into an inactive conformation and prevent lipid translocation. To investigate how this autoinhibition mechanism is relieved in vivo, the N- and C-terminal tails were expressed as eGFP-fusion peptides in E. coli and immobilized on anti-eGFP nanobody resin for pull-down experiments to identify binding partners and/or phosphorylation by mass spectrometry.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "IMPACT OF MEMBRANE POLYUNSATURATED FATTY ACIDS ON D2R HETEROMERIZATION AND SIGNALING", "Presenter": "Garima C.N Thakur", "Sex": "Female", "Presenter Affiliation": "Institut de Chimie et de Biologie des Membranes et des nano-objets, Université de Bordeaux, CNRS, UMR 5248", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Poster", "Employment": "Post-doc", "Abstract": "Schizophrenia is a severe neuropsychiatric disorder affecting 24 million people worldwide, characterized by immense clinical and neurobiological heterogeneity. Traditional antipsychotic strategies primarily target the monomeric Dopamine D2 Receptor (D2R), but these approaches often fall short by ignoring physiological receptor cross-talk. In the central nervous system, D2R physically interacts with the Cannabinoid 1 Receptor (CB1R) to form a distinct pharmacological entity with fundamentally reprogrammed G-protein coupling profiles. While systemic lipid disturbances are associated with the pathology and recent data suggest allosteric modulation of D2R activity by the local membrane lipid environment, the precise molecular architecture of this heteromeric complex and how its physical interface drives unique intracellular signaling dynamics remain entirely unknown. In this context, this project investigates how polyunsaturated fatty acids (PUFAs) modulate D2R-CB1R heteromerization and its subsequent downstream signaling. This homodimer target is justified by preliminary time-resolved fluorescence resonance energy transfer (TR-FRET) data demonstrating interaction between both receptors. While each receptor individually couples to the inhibitory pathway, their co-stimulation in co-expressing cells is reported to lead to an unexpected increase in cAMP production, attributed to a functional switch to activation that remains to be proved.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "IN-SITU STRUCTURE OF BACTERIAL OUTER MEMBRANE PROTEIN A (OMPA) WITH FAST MAGIC-ANGLE SPINNING NMR", "Presenter": "Tanguy LE MARCHAND", "Sex": "Male", "Presenter Affiliation": "Centre de Résonance Magnétique Nucléaire (CRMN) à Très Hauts Champs de Lyon (UMR 5082 - CNRS, ENS Lyon, UCB Lyon 1)", "Presenter Country": "France", "Presenter Email": "tanguy.le_marchand@ens-lyon.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Outer Membranes (OM) of Gram-negative bacteria are key targets for antimicrobial research. Their investigation is however challenging for most analytical techniques due to their complex and unique structure. The outer membrane is asymmetric, composed of lipopolysaccharides (LPS) on the outer leaflet and phospholipids on the inner leaflet, which makes it difficult to mimic in vitro. In this work, we investigated Outer Membrane Protein A (OmpA) expressed in OM vesicles of E. coli by MAS NMR. Taking advantage of a tailored isotope labeling scheme, fast MAS capabilities, and magnetic fields up to 1.2 GHz, we determined the first experimental structure of an OMP in a native OM environment. Comparison with solution NMR and X-ray diffraction structures highlights clear differences in the conformation of the extracellular loops, which can be directly linked to the more realistic membrane environment. In addition, we conducted one of the most comprehensive relaxation analyses for this class of samples in the solid state and found significant differences in protein dynamics with respect to previous solution-NMR studies. These observations are in excellent agreement with molecular dynamics simulations carried out in asymmetric membranes and demonstrate a clear, direct impact of the native bacterial membrane on OmpA structure and dynamics.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "IN-SITU STRUCTURE OF OUTER MEMBRANE PROTEIN A: A NOVEL STRUCTURE REFINEMENT PROTOCOL", "Presenter": "Veronica CRESPI", "Sex": "Female", "Presenter Affiliation": "Inserm, Pharmacology and Transplantation, UMR 1248, Centre de Biologie et Recherche en Santé, Université de Limoges", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "The structure and function of proteins are directly influenced by their surrounding chemical environment. This is particularly relevant for membrane proteins, which naturally reside in complex lipid bilayer membranes. However, structural and functional characterization of membrane proteins are generally accomplished in model systems, such as detergent micelles, lipid nanodiscs, or liposomes. Here we used ultra-fast MAS solid-state NMR spectroscopy to determine the structure of an outer membrane protein, OmpA from Klebsiella pneumoniae (a Gram-negative species), embedded in the native bacterial outer membrane, a highly asymmetric bilayer. Determining the structure and properties in such a complex environment required a novel refinement protocol, developed specifically for the complex bacterial membrane. The outer leaflet consists of lipopolysaccharides with massive glycan head groups, which have low mobility due to a strong hydrogen bonding network; such low mobility makes protein insertion problematic, and the dynamics of the inserted protein particularly slow in the large head group region. Therefore, any protein structure has little chance to undergo any structural change after insertion. However, NMR-based information (on dihedral angles and inter-nuclear distances) is compatible with a broad range of structures, with differences concentrated in the four extracellular loops, in contact with the glycan group. In order to reproduce the structural variability of the loops, we devised a procedure in 5 steps, including an MD simulation step of the protein in a POPC membrane, with imposition of strong NMR-based restraints, allowing to sample many NMR-compatible conformations. Once embedded in the bacterial membrane, NMR-compatible structures are stable and different from the structures determined by solution NMR on the same protein in detergent micelles. Protein dynamics is slow, beyond the microsecond time scale, in agreement with NMR relaxation data. Overall, our new protocol yields a more realistic interpretation of protein conformational dynamics and protein interactions with the native bacterial membrane environment.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "INTERLEAFLET COUPLING DRIVES THE THERMOTROPIC BEHAVIOUR OF ASYMMETRIC MEMBRANES", "Presenter": "Julia B. BASSILA", "Sex": "Female", "Presenter Affiliation": "University of Genoa, Department of Physics", "Presenter Country": "Italy", "Presenter Email": "giulia.rossi@unige.it", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Interleaflet coupling is central to membrane organization and function. Registration of ordered domains has been proposed to generate transbilayer signaling platforms, while ordered lipid environments can regulate membrane-protein function through selective recruitment. Yet, how such coupling operates in asymmetric membranes remains incompletely understood. Experiments have shown that, in asymmetric bilayers, liquid-ordered domain formation can be induced or suppressed by the composition of the apposing leaflet, demonstrating composition-dependent coupling. More recently, asymmetric POPC/POPE vesicles revealed a distinct cooling-induced coupling, in which leaflet melting transitions are either cooperative or decoupled depending on lipid sidedness and vesicle curvature. Here, we use molecular dynamics simulations to study the thermotropic behavior of POPC and POPE membranes with controlled compositional and numerical asymmetry. We developed a simulated-cooling protocol based on the sticky-tape setup, allowing asymmetric membranes to relax both area strain and bending energy during the liquid-to-gel transition. In compositionally symmetric membranes, numerical asymmetry induces curvature but produces only weak leaflet decoupling. In POPC^up/POPE^down membranes, instead, numerical asymmetry controls the mismatch between leaflet order parameters and determines whether melting is coupled or decoupled. The strongest decoupling occurs when the POPC leaflet is lipid-depleted, in agreement with the curvature-dependent behavior observed experimentally. This decoupling is enabled by the stabilization of an intermediate POPC phase with liquid-like dynamics, partially ordered tails, and strongly reduced differential stress.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "INVESTIGATING THE COLLECTIVE MECHANISM OF POLYBIA-MP1 ACROSS MEMBRANE MODELS", "Presenter": "Thaisa Joanna UZAN", "Sex": "Female", "Presenter Affiliation": "École Normale Supérieure de Lyon, Laboratoire de Biologie et Modélisation de la Cellule", "Presenter Country": "France", "Presenter Email": "thaisa.uzan@ens-lyon.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Antimicrobial peptides are short, predominantly cationic molecules whose mechanism of action involves electrostatic and hydrophobic interactions with cell membranes, disrupting lipid packing and inducing pores or defects that lead to cell death. Polybia-MP1 (MP1) is a peptide that is well known for its selective action against bacteria, targeting anionic phospholipids like phosphatidylglycerol (PG). However, the molecular details of its collective mechanism, specifically regarding pore formation and the impact of membrane complexity, remain to be fully elucidated. We employ a multiscale computational strategy to investigate the collective behavior of MP1 in different membrane models. Preliminary All-Atom (AA) molecular dynamics simulations characterize the initial adsorption of individual peptides, while Coarse-Grained (CG) simulations overcome the temporal and spatial limitations to capture concentration-dependent events, including peptide aggregation and the impact of the peptides on different membrane compositions. We aim to identify the structural features that optimize lytic action and selectivity, bridging the gap between specific atomic interactions and large-scale membrane processes.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "ION FLOW MODELING OF INSECT ODORANT RECEPTORS VIA COMPUTATIONAL ELECTROPHYSIOLOGY", "Presenter": "Sebastien FIORUCCI", "Sex": "Male", "Presenter Affiliation": "Université Côte d’Azur, CNRS, ICN", "Presenter Country": "France", "Presenter Email": "sebastien.fiorucci@univ-cotedazur.fr", "Presentation Requested": "Oral or poster", "Employment": "Post-doc", "Abstract": "Insects detect odors through odorant-activated ion channel complexes that are composed of an odorant receptor (OR) and an odorant receptor co-receptor (Orco), which are thought to exist in a 1:3 OR/Orco ratio in vivo. Recently published cryo-EM structures of OR/Orco complexes from mosquitoes with bound known agonists (AgamOR28 from Anopheles gambiae with 2,4,5-trimethylthiazole, and AaegOR10 from Aedes aegypti with o-cresol) showed a displacement of the transmembrane helix 7b (TM7b) of the ORs, which allows ions to flow through the ion channel. To elucidate the mechanism of the ion flow, we used Computational Electrophysiology (CompEL) protocol using Amber force fields and the molecular dynamics (MD) code Gromacs. Ion flow was observed for the apo structure, as well as for agonist-bound structures. Comparing the different systems revealed key residues and a side entrance to the pore.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "ISOLATION AND CHARACTERIZATION OF DOPAMINE D2 RECEPTOR IN COPOLYMER-BASED NANODISCS", "Presenter": "Estelle RASCOL", "Sex": "Female", "Presenter Affiliation": "Univ. Bordeaux, CNRS, Bordeaux INP, CBMN, UMR 5248", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral or poster", "Employment": "Unknown", "Abstract": "The Dopamine D₂ receptor (D₂R) is an integral membrane protein belonging to the G-protein coupled receptor (GPCR) family. Embedded in the cell lipid membrane by its seven transmembrane helices, it is a major therapeutic target, antagonists being used to treat schizophrenia or agonists used in Parkinson's disease treatment. Isolation of membrane proteins, and GPCRs in particular, still represents a huge challenge, even if necessary for functional and structural studies. Among the different strategies used to isolate GPCRs, amphipathic copolymers represent an attractive option as they allow their extraction and purification in their native lipid environment, increasing the chances for retaining their function and structure. The aim of this work was to obtain pure and functional D₂R surrounded by its native lipids in copolymer-based nanodiscs. A series of eight different copolymers was tested to screen for the best candidate for D₂R solubilization, purification, and functionality. For all copolymers, the functionality was evaluated by a ligand binding assay using fluorescence polarization (FP). Specific ligand binding has been observed for DIBMA derivatives copolymers. In addition, D₂R basal activity was demonstrated by measuring GTPase activity of Gᵢ₁ and Gₒₐ heterotrimeric proteins in DIBMA 12 nanodiscs.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Heath"}, {"Title": "LACTOCOCCUS LACTIS, A PROMISING AND EFFICIENT FACTORY FOR THE BIOPRODUCTION OF FUNCTIONAL SOLUBLE AND MEMBRANE PROTEINS", "Presenter": "Agnes FRELET-BARRAND", "Sex": "Female", "Presenter Affiliation": "Université Marie et Louis Pasteur, CNRS, institut FEMTO-ST", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "Lactococcus lactis, a gram-positive bacterium considered the model lactic acid bacteria, emerged at the beginning of the last century as a good alternative for protein expression and characterizations. Already largely used in industry for the production of fermented foods and consumed by humans for hundreds of years, this “generally recognized as safe” (GRAS) microorganism can express functional soluble and membrane proteins (MPs), including therapeutic proteins and bacterial and viral antigens for vaccination, even at the industrial scale. L. lactis is an interesting alternative host because of its moderate proteolytic activity, the absence of inclusion-body formation and of endotoxin production, and its efficient targeting of the MPs into a single plasma membrane. This system also allows properly folded expression of proteins in their native oligomeric form. Among the different gene expression systems, the tightly regulated nisin-controlled gene expression (NICE) system is the most broadly used. This system is based on genes involved in the biosynthesis and regulation of the antimicrobial peptide nisin. Using the NICE system, until 2022, 115 MPs from prokaryotic or eukaryotic origins, with diverse topologies and sizes, have been successfully expressed, allowing their functional and/or structural characterizations.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "LATTICE-BASED MESOSCALE SIMULATIONS OF CELL MEMBRANE ADHESION AND DISTRIBUTION OF LIPID RAFTS", "Presenter": "Iyad BIN HUSSAIN", "Sex": "Male", "Presenter Affiliation": "Institute of Physics, Polish Academy of Sciences", "Presenter Country": "Poland", "Presenter Email": "iyadhussain@ifpan.edu.pl", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Cell membrane is an interface that separates the intracellular fluids and organelles from the extracellular environment. This interface serves as a platform for many relevant biological processes such as tissue formation, cell-cell communication, nutrient uptake, and drug efflux. The cell membrane is composed of diverse macromolecules—primarily lipids and proteins—which govern various biological processes. The interaction between two opposing cells is mediated through a process called membrane adhesion, which arises from the specific binding of membrane-anchored receptor proteins to their ligands present in the opposing membrane. This physical contact of opposing cells can cause significant changes in the spatial distribution of membrane proteins and lipids, affecting the dynamic rearrangement of cell membranes. Here, we employ a statistical–mechanical model and perform Monte Carlo simulations to study a system of adhered membranes in which the receptor and ligand proteins exhibit affinity for association with so-called lipid rafts, which are fluctuating nanoscale molecular clusters enriched in sphingolipid and cholesterol. We focus on equilibrium properties of the adhered membranes in the mixed phase, where both the membrane-anchored proteins and lipid rafts are distributed more-or-less uniformly within the membranes. Our simulation results show that lateral attraction between lipid rafts enhances the receptor–ligand binding, affecting the adhesion of the membranes. On the other hand, the receptor–ligand binding causes lipid rafts to be distributed less uniformly within the membranes and, simultaneously, leads to an increased co-localization of the membrane-anchored proteins with lipid rafts.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "LINKING MEMBRANE ORGANISATION TO LIGHT-HARVESTING REGULATION IN LHCII MEMBRANES", "Presenter": "Ashley M HANCOCK", "Sex": "Female", "Presenter Affiliation": "ICFO-Institut de Ciencies Fotoniques, The Barcelona Institute of Science and Technology", "Presenter Country": "Spain", "Presenter Email": "", "Presentation Requested": "Oral or poster", "Employment": "Post-doc", "Abstract": "Photosynthetic light harvesting is governed by collective excitonic interactions within densely packed pigment–protein membranes, where nanoscale organization shapes both energy transfer and photoprotective dissipation. In plants, the major antenna complex LHCII sits at the center of this balance, yet the causal link between lateral membrane organization and excitation-energy dynamics remains poorly resolved. Here, I present two complementary strategies to interrogate LHCII organization in model photosynthetic membranes and how it relates to energy transfer and dissipation. First, in-membrane electrophoresis (IME) applies an in-plane electric field across a supported lipid bilayer (SLB), redistributing charged membrane components to generate continuous concentration gradients within a single membrane. By using IME to reorganize LHCII in polymer-confined patterned SLBs, Fluorescence Lifetime Imaging Microscopy (FLIM) reveals that local increases in protein density shorten the fluorescence lifetime, consistent with the onset of energy-dissipative quenching. Second, I present the method of Structured Excitation Energy Transfer (StrEET) microscopy to quantify excitation transport in LHCII-containing SLBs. StrEET follows the decay of a spatially patterned excitation, giving direct access to exciton transport. Applied to LHCII bilayers, StrEET provides a direct, low-perturbation measure of the exciton diffusion length, allowing energy transport to be correlated with the local protein density and quenching resolved by FLIM.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "LIPID COMPOSITION GOVERNS MEMBRANE BINDING AND CONFORMATIONAL DYNAMICS OF THE MYOSIN-1C TAIL DOMAIN", "Presenter": "Hafez RAZMAZMA", "Sex": "Male", "Presenter Affiliation": "University of Warwick, Warwick Medical School", "Presenter Country": "UK", "Presenter Email": "hafez.razmazma@warwick.ac.uk", "Presentation Requested": "Poster", "Employment": "Post-doc", "Abstract": "Class I myosins are essential linkers between the actin cytoskeleton and the plasma membrane, where they generate tension and organize membrane nanodomains. Myosin-1c (Myo1c) is a key example: its tail domain, composed of three calmodulin-bound IQ motifs, a post-IQ linker, and a pleckstrin homology (PH) domain, anchors the motor to the inner leaflet of the plasma membrane. The PH domain exhibits selectivity for anionic phospholipids including PIP2 and phosphatidylserine (PS), yet the molecular basis for this specificity, and its consequences for the lever arm geometry and membrane orientation of the motor, remain unexplored. Here, we use experimental and molecular dynamics simulations to examine how lipid composition shapes the membrane-binding and conformational dynamics of the Myo1c tail domain in different biologically relevant membrane environments. Stable membrane association requires anionic lipids (PS and PIP2), as the protein rapidly dissociates from neutral DOPC membranes, whereas all anionic lipid conditions support stable membrane association. The PH domain tilt angle relative to the membrane normal is strongly lipid-dependent: DOPS yields the most upright, engaged orientation, whereas PIP2 alone results in a more tilted conformation, suggesting distinct binding modes for the two anionic lipid species. Analysis of the inter-segment bending angle at the IQ3/post-IQ hinge reveals that anionic lipid binding straightens this hinge region compared to the dissociated soluble condition, indicating that membrane engagement propagates conformational order from the PH domain anchor through the linker region toward the lever arm.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "LIPID-DRIVEN ORGANIZATION OF THE SYNERGISTIC ANTIMICROBIAL PEPTIDES PGLA AND MAGAININ 2 ON MEMBRANE SURFACES", "Presenter": "Christopher AISENBREY", "Sex": "Male", "Presenter Affiliation": "UMR7177 CNRS/Université de Strasbourg", "Presenter Country": "France", "Presenter Email": "aisenbrey@unistra.fr", "Presentation Requested": "Oral or poster", "Employment": "CNRS", "Abstract": "The antimicrobial peptides PGLa and magainin 2 act synergistically on lipid membranes, yet their lateral organization on the membrane surface remains unclear. Here, we investigate their surface distribution using a fluorescence quenching approach capable of detecting intermolecular contacts within ~1 nm. PGLa and magainin 2 were labeled with the fluorophore NBD at different amino acid positions to probe peptide–peptide proximities in membrane-bound states. Our results reveal distinct distribution patterns for both peptides that change in the presence of the synergistic partner. Based on the quenching data, we propose a distribution model describing the relative arrangement of PGLa and magainin 2 on the membrane surface. Furthermore, the observed distribution behavior strongly depends on the lipid composition, indicating the important role of lipids in peptide organization and in promoting peptide–peptide interactions. Since antibiotic peptides are well known to disturb the order of lipid fatty-acid-chains, it is likely that this disordering constitutes the driving force for the observed clustering of the peptides on the membrane surface.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ung"}, {"Title": "LIPIDS ARE ENDOGENOUS MODULATORS OF CLASS C GPCRS", "Presenter": "Anaïs MENNY", "Sex": "Female", "Presenter Affiliation": "Institut de Génomique Fonctionnelle (IGF), University of Montpellier, CNRS, INSERM", "Presenter Country": "France", "Presenter Email": "anais.menny@igf.cnrs.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "G Protein-Coupled Receptors (GPCRs) are modulated by membrane lipids, which help stabilize conformations, shape ligand pockets, and influence downstream signaling via G proteins and β-arrestins. However, how lipids modulate class C GPCRs, a sub-family of 22 obligate dimers with extensive membrane interactions, is not known. Yet, several observations suggest lipids may be key modulators of this family. First, recent cryo-EM structures revealed lipid densities at receptors’ transmembrane domain (TMD) dimer interfaces, whose presence appears to be conformation-dependent. Second, class C receptors often localize in specific membrane nano-domains, and their function is disrupted in lipid-altered cellular contexts, as seen in diseases like Niemann-Pick. Here, we present our latest work addressing these gaps in knowledge, mainly focusing on mGluR2 as a model of the family. Using a combination of cryo-EM, nanobody conformational sensors, nanodisc reconstitution, and TIRF microscopy, we found that cholesterol is a negative allosteric modulator (NAM) of mGluR2, requiring multiple binding sites at its inactive TMD interface for efficient functional modulation. We further show that this NAM effect is conserved across all mGlu, GABAB, and CaS receptors. Using all-atom molecular dynamics combined with in-cellulo validation, we also identify two anionic lipid-binding sites that independently act on mGluR2 conformation and recruitment of signaling partners. Together, our findings reveal that lipids are endogenous allosteric modulators of class C GPCRs, regulating receptor conformational states at their TMD dimer interfaces and modulating their interactions with other proteins.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "LIPOPROTEIN RECOGNITION AND TRANSPORT BY LOLCDE ABC TRANSPORTERS", "Presenter": "Elisa ALIU", "Sex": "Female", "Presenter Affiliation": "Molecular Microbiology and Structural Biochemistry (MMSB), CNRS UMR5086, Université de Lyon", "Presenter Country": "France", "Presenter Email": "elise.kaplan@cnrs.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Antibiotic resistance is a major public health concern. Among the defense mechanisms of bacteria, the cell envelope acts as a first line of defense against antibiotics. In Gram-negative bacteria, lipoproteins play an essential role in maintaining membrane integrity, adhesion, virulence, and nutrient uptake. The transport of lipoproteins to the membrane is carried out by the specialized system ‘Lol’ (Localization of Lipoproteins). It consists of five proteins in Escherichia coli. Lipoproteins are extracted from the inner membrane by an ABC transporter, LolCDE, then passed to the periplasmic chaperone LolA, and finally inserted into the outer membrane by LolB. The ABC transporter LolCDE represents a particularly attractive target for antibiotics. Recent structural advances have improved our understanding of its mechanism of action. However, many functional particularities exist in other Gram-negative bacteria, particularly in lipoprotein recognition, and still raise questions. The development of biochemical tools is essential for the functional and structural study of the Lol system. Various cloning, expression, and purification strategies have been implemented, enabling the production of high-quality recombinant proteins. Initial characterization shows that the purified LolCDE membrane complexes retain ATPase activity. In parallel, several protocols for reconstitution in proteoliposomes have been developed to reproduce lipoprotein transport in vitro. These results represent a crucial step towards the complete reconstruction of the Lol system and the study of its action mechanism.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "LOCALIZATION AND QUANTIFICATION OF PMAP23 DURING E. COLI KILLING", "Presenter": "Federico CARNERI", "Sex": "Male", "Presenter Affiliation": "Department of Chemical Science and Technologies, University of Rome Tor Vergata", "Presenter Country": "Italy", "Presenter Email": "federico.carneri@uniroma2.it", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Antimicrobial peptides (AMPs) rapidly kill bacteria by permeabilizing their membranes, yet their spatial distribution throughout the killing process remains largely unresolved. In our previous kinetic study, dansyl-labelled PMAP23 revealed four sequential events during its interaction with E. coli: outer-membrane binding, outer-membrane permeabilization, onset of bacterial killing, and inner-membrane permeabilization. Here, we extend this kinetic framework by investigating the localization and mobility of ATTO647-labelled variant of PMAP23 before and after bacterial killing using two-photon NAD(P)H phasor-FLIM, confocal microscopy, stimulated emission depletion microscopy (STED), and raster image correlation spectroscopy (RICS). NAD(P)H-FLIM revealed concentration-dependent changes in the mean bound NAD(P)H fraction, consistent with bacterial killing. Mid-plane STED imaging resolved two distinct peptide distributions: a predominant membrane-associated population and a smaller peptide fraction showing intracellular accumulation, both occurring in membrane-permeabilized bacteria as shown by Sytox Green co-staining. RICS revealed localization-dependent peptide mobility regimes across both permeabilizing and non-permeabilizing peptide concentrations. Bacteria displaying predominantly membrane-associated PMAP23 showed both a slow component (D ~ 0.2–0.3 µm² s⁻¹) and a much faster mobile population, compatible with freely diffusing peptide molecules in the cytosol. In contrast, bacteria showing extensive intracellular accumulation displayed only a slow component, suggesting that intracellularly accumulated peptide is not freely diffusing but is instead strongly confined.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "MARTINI 3 COARSE-GRAINED FORCEFIELD FOR NON-CANONICAL AMINO ACIDS", "Presenter": "Luís BORGES-ARAÚJO", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Biologie et Modélisation de la Cellule, CNRS, UMR 5239, Inserm, U1293, Université Claude Bernard Lyon 1, Ecole Normale Supérieure de Lyon", "Presenter Country": "France", "Presenter Email": "luis.borges@ens-lyon.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Peptides and proteins represent increasingly important targets for therapeutic development due to their high specificity and favorable toxicity profiles. However, their application is often limited by challenges such as poor membrane permeability, low metabolic stability, and limited aqueous solubility. Side-chain and backbone modifications, including the incorporation of non-canonical amino acids (ncAAs), offer viable routes to overcome these limitations. Yet, the vast chemical space accessible through such modifications makes systematic exploration challenging, requiring computational approaches to accelerate their rational design and screening. Despite this potential, the limited availability of suitable computational models has left most ncAAs inaccessible to molecular dynamics simulations. Here, we address this challenge by extending the Martini 3 coarse-grained force field, and its soon-to-be-released high-resolution protein model, to incorporate over 250 non-canonical amino acids. We validate the extended model against available experimental and atomistic reference data and demonstrate its ability to capture structure–property relationships relevant to peptide membrane permeability and solubility. Our results substantially expand the chemical space accessible to Martini, enabling the study and rational engineering of chemically diverse peptides and proteins.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "MECHANISM OF ACTION OF NON-LYTIC ANTIMICROBIAL PEPTIDES STUDIED BY IN VIVO SOLID-STATE NMR AND FLUORESCENCE MICROSCOPY", "Presenter": "Hugo LEGRAS-HEMONNOT", "Sex": "Male", "Presenter Affiliation": "Chimie Physique et Chimie du Vivant, CPCV, CNRS UMR 8228, Sorbonne Université", "Presenter Country": "France", "Presenter Email": "hugo.legras-hemonnot@sorbonne-universite.fr", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Non-lytic antimicrobial peptides (AMPs) kill bacteria by reaching the cytoplasm and binding with an intracellular target, but the way they cross the cell membrane is poorly understood. We used in vivo ²H solid-state NMR to study how the translocation of several non-lytic AMPs, such as buforin and oncocin, affects the order and rigidity of the deuterium-labeled membranes of E. coli. We also used timelapse fluorescence microscopy and microfluidics to gain insight into the succession of events induced by the presence of AMPs at the membrane level. We find that, even though the effect of these non-lytic AMPs on the membrane should be limited and transient, they actually have quite distinguishable effects on the membrane rigidity and permeability. We also find that those effects vary from one peptide to another, confirming a wide diversity of mechanisms used to cross the membrane.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ambrosetti"}, {"Title": "MECHANISTIC INSIGHT INTO IONIZABLE CATIONIC LIPID-MEDIATED ENDOSOMAL ESCAPE VIA TRANSIENT LIPID COMPLEXES", "Presenter": "David Noel ZIMMER", "Sex": "Male", "Presenter Affiliation": "Faculty of Physics and Astronomy, Ruhr University Bochum", "Presenter Country": "Germany", "Presenter Email": "", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "RNA-based therapeutics have demonstrated remarkable efficacy and hold great promise for future applications in personalized medicine. The most common delivery systems for these drugs are lipid-based nanoparticles (LNPs), which incorporate ionizable cationic lipids (ICLs) as key components. Among others, ICLs are believed to facilitate endosomal escape of the cargo by interacting with anionic lipids in the endosomal membrane, although the underlying molecular mechanism remains unclear. One prevailing hypothesis suggests that membrane destabilization is mediated by cone-shaped complexes formed between ICLs and endosomal anionic lipids. However, no clear evidence of stable co-localization of anionic and cationic lipids has been presented so far. Here, to address this gap, equilibrium and nonequilibrium molecular dynamics simulations of model membrane systems containing DODMA (ICL), DOPS, or PI3P (anionic lipid), and DOPE or cholesterol (helper lipid) are performed. The results confirm the absence of co-localization at equilibrium but reveal transient formation of cone-shaped complexes during lamellar-to-inverted-hexagonal phase transitions, which considerably accelerates the transition process. These findings suggest that transient lipid–lipid interactions, rather than stable complexes, may play a critical role in facilitating endosomal escape. This mechanistic insight may inform the rational design of ICLs tailored to interact with specific endosomal anionic lipids, thereby enabling more effective and targeted delivery strategies for RNA-based therapeutics.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "MITOCHONDRIAL PREPROTEIN IMPORT: TIM50 MEDIATED COUPLING OF PRESEQUENCE TRANSLOCASE AND RESPIRATORY CHAIN COMPLEXES", "Presenter": "Raffaele IEVA", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Microbiologie et Génétique Moléculaires (LMGM), Centre de Biologie Intégrative (CBI), Université de Toulouse, CNRS", "Presenter Country": "France", "Presenter Email": "raffaele.ieva@utoulouse.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Biogenesis of mitochondria, organelles crucial for cell metabolisms and signaling, strictly depends on the import of >1000 protein precursors (preproteins). The mitochondrial membrane potential (ΔΨ) generated by respiratory chain complexes (RCCs) energizes consecutive preprotein import steps mediated by the presequence translocase (TIM23). In addition to promoting electrophoretic transport of cleavable, positively charged presequence signals, ΔΨ also energizes transport of mature protein segments. The translocase accessory subunits Tim21 and Mgr2 mediate an association of TIM23 with RCCs, thus maintaining optimal ΔΨ during protein sorting into the membrane. In addition, Pam17 promotes import of matrix-targeted preproteins that are particularly dependent on ΔΨ, however, it is unclear if matrix-translocating TIM23 physically associates with RCC. We have recently shown that the TIM23 core subunit Tim50 may also interact with RCCs, but the molecular basis and functional significance of this interaction have remained unclear. Here, using affinity purification, blue native PAGE, and mitochondrial import assays in wild-type and mutant yeast mitochondria, we investigated the molecular basis and functional relevance of the Tim50-RCC interaction. We found that Tim50 binds to mature respiratory chain supercomplexes III₂IV and III₂IV₂. This interaction is independent of the known TIM23-RCC coupling mediated by Tim21 and Mgr2 and is enhanced upon deletion of the Tim50 IMS domain. Our data indicate that this new Tim50-RCC coupling mechanism promotes import of matrix-targeted preproteins particularly dependent on ΔΨ. We conclude that distinct TIM23-RCC coupling mechanisms contribute to mitochondrial preprotein import.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "MODELLING DIELECTRIC PERMITTIVITY OF WATER CONFINED BETWEEN CHARGED LIPID LAYERS WITH A MODIFIED POISSON-BOLTZMANN MODEL", "Presenter": "Ludovic GARDRÉ", "Sex": "Male", "Presenter Affiliation": "Université Claude Bernard Lyon 1, CNRS, ILM, UMR 5306", "Presenter Country": "France", "Presenter Email": "ludovic.gardre@univ-lyon1.fr", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Mycobacterium tuberculosis, the causative agent of tuberculosis, possesses an unusually thick, waxy cell envelope composed of a diverse array of complex lipids. These lipids not only provide the structural framework of the mycobacterial envelope but also contribute to virulence by perturbing host membranes and interacting with host-cell receptors. Understanding their organization and dynamics is therefore essential for deciphering the molecular basis of mycobacterial pathogenicity. In this presentation, I will highlight our recent works using multiscale molecular dynamics (MD) simulations to study mycobacterial lipids. Atomistic simulations have provided molecular-level insights into the organization of the outer membrane, the mycomembrane. Coarse-grained simulations have then been employed to investigate the redistribution of the major virulence lipid phthiocerol dimycocerosate (PDIM) within the mycomembrane. In parallel, all-atom MD simulations have been used to characterize the structure and dynamics of the mycobacterial inner membrane (MIM). Beyond their role in the bacterial envelope, mycobacterial lipids display distinct behavior in host-cell membranes. When incorporated into host-like membrane models, they disrupt membrane organization, providing a molecular basis for their activity as virulence factors. Together, these studies demonstrate how multiscale MD simulations provide a powerful framework for uncovering the structure, dynamics, and biological functions of mycobacterial lipids.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "MODELLING HOST-PATHOGEN INTERACTIONS USING MULTISCALE MD SIMULATIONS: THE MYCOBACTERIUM TUBERCULOSIS CASE", "Presenter": "Matthieu CHAVENT", "Sex": "Male", "Presenter Affiliation": "Université de Toulouse, CNRS, Laboratoire de Microbiologie et de Génétique Moléculaires, CBI", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Lipid membranes play key roles in biological systems. Electrostatic interactions often govern nearby dynamics and can even affect membrane structure: like-charged lipid layers immersed in multivalent ion solutions can attract each other. This counter-intuitive effect is explained by strong coupling driven by ion correlations. Recent experiments show that similar attraction occurs with monovalent ions, possibly due to reduced water permittivity under confinement. To assess this explanation, we investigate the water permittivity using molecular dynamics simulation and modeling. We develop a modified Poisson-Boltzmann model with spatially varying permittivity and explicit Born solvation energy for ions. We use it to extract effective permittivity profiles from MD simulations of charged lipid layers. The model uses this permittivity to compute ionic charge densities, which are in good agreement with those from the simulations. Our approach could be applied to various systems where electrolytes are confined between charged interfaces, such as polyelectrolytes, biological molecules, or clays.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Delemotte"}, {"Title": "MOLECULAR AND STRUCTURAL INSIGHTS INTO HAEMOPHILUS INFLUENZAE HAEM ACQUISITION FROM HUMAN HAEMOPROTEINS", "Presenter": "Xiu TIAN", "Sex": "Female", "Presenter Affiliation": "Institute of Physico-Chemical Biology (IBPC), UMR7099, Laboratory of Membrane Proteins Biochemistry, CNRS, Paris Cité University", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Haemophilus influenzae is an opportunistic, Gram-negative bacterium that only colonizes humans and can be responsible for various diseases. As a haem auxotroph, this bacterium needs to acquire haem from its host haemoproteins to survive and sustain infection. Hgps (haemoglobin and haemoglobin-haptoglobin proteins) are a family of TonB-dependent transporters that bind haemoglobin (Hb) and are essential for H. influenzae growth in the presence of haemoglobin-haptoglobin (Hb-Hp) as the sole source of haem. Here, we used a combination of functional analysis and cryo-EM to gain insight into the mechanism by which Hgps bind haemoglobin (Hb) and extract haem from it. We found that Hgps preferentially interact with human, dimeric haemoglobin (K_D ~ nM). This interaction results in the distortion of the F-helix from the haemoglobin beta chain (Hb-b) and leads to the energy-independent transfer of haem from Hb-b to a conserved tyrosine located on the receptor plug-loop. Following transfer, the Tyr-Fe bond is stabilized by the Hb-b proximal histidine (His92, F8), which has been displaced 8.5 Å toward the receptor. Altogether, we describe a new mechanism of haem acquisition in Gram-negative bacteria, which deviates significantly from the one described previously for haem-TBDTs and appears more similar to the one described for Gram-positive bacteria haem import systems.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ung"}, {"Title": "MOLECULAR CHARACTERIZATION OF GANGLIOSIDE-PEPTIDE INTERACTIONS", "Presenter": "Clotilde NARCY", "Sex": "Female", "Presenter Affiliation": "Sorbonne Université, Laboratoire CPCV", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Gangliosides are glycosphingolipids found in small quantities in cell membranes and are characterized by remarkable molecular diversity. Recently, a renewed interest in the analysis of these species has reinforced our conviction that a detailed and more thorough characterization of these molecules is necessary to fully understand their biological functions at the molecular level. To address this challenge, we developed an innovative mass spectrometry-based workflow for the precise and quantitative analysis of gangliosides. This approach combines MALDI-TOF mass spectrometry and ion mobility spectrometry, enabling detailed characterization of gangliosides at multiple structural levels, from ganglioside classes to individual molecular species and their potential isomers. The method was first established using a complex commercial gangliosides mixture before being applied to cellular extracts. Gangliosides are key regulators of homeoprotein paracrine signaling. In order to better understand their precise role, we investigate their molecular interaction with En2H₃, a cell-penetrating peptide (CPP) derived from the homeoprotein Engrailed2, using complementary biophysical and cellular approaches. In vitro studies, including NMR spectroscopy, differential scanning calorimetry (DSC), and affinity photo-cross-linking, are performed on membrane models (MLVs) containing the well-characterized commercial gangliosides mixture. In parallel, cellular assays quantify En2H₃ internalization in cells expressing distinct ganglioside profiles, which will be characterized using our newly developed analytical workflow.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Nadler"}, {"Title": "MOLECULAR DISTRIBUTION IN LIPID NANOPARTICLES IN THE PRESENCE OF DIFFERENT mRNA TOPOLOGIES AND IONIZABLE LIPIDS", "Presenter": "Paulo C. T. SOUZA", "Sex": "Male", "Presenter Affiliation": "École Normale Supérieure de Lyon, Laboratoire de Biologie et Modélisation de la Cellule", "Presenter Country": "France", "Presenter Email": "paulo.telles_de_souza@ens-lyon.fr", "Presentation Requested": "Oral or poster", "Employment": "Post-doc", "Abstract": "Lipid nanoparticles (LNPs) are the leading delivery vehicles for mRNA therapeutics, including vaccines. Despite their clinical success, key challenges persist regarding mRNA stability, encapsulation efficiency, and endosomal release. The molecular-level understanding of how RNA topology influences the internal organization of LNPs remains limited. In particular, the formation of water pockets and bleb-like structures within LNPs is poorly characterized, yet these features may critically affect mRNA delivery. Molecular dynamics simulations with Martini coarse-grained (CG) models allowed modeling the complexity of LNPs and studying their internal organization. Therefore, in this work, we use Martini CG simulations to study how different RNA topologies and ionizable lipids (ILs) affect molecular distribution in LNP formulations. We established a minimal simulation setup based on Moderna and Pfizer/BioNTech LNP compositions, incorporating the clinically relevant ILs MC3, SM-102, or ALC-0315 with DSPC helper lipids and cholesterol. System parameters were optimized to balance computational tractability with sensitivity to RNA-induced organizational changes. We found that mRNA alters IL distribution and water pocket formation in an IL-dependent manner. This framework enables systematic characterization of RNA topology effects on LNP organization and provides a basis for evaluating newly designed ILs toward more effective mRNA delivery systems.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "MOLECULAR DYNAMICS EVALUATION OF MECHANISTIC PROPERTIES DRIVING PASSIVE PERMEATION IN BINARY BILAYERS", "Presenter": "Gabin FABRE", "Sex": "Male", "Presenter Affiliation": "INSERM U1248 Pharmacology & Transplantation, Faculty of Pharmacy, University of Limoges", "Presenter Country": "France", "Presenter Email": "gabin.fabre@unilim.fr", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "While passive permeation is important for pharmacokinetics, the thermodynamic impact of biological membrane complexity remains poorly mapped. We systematically evaluated how lipid bilayer composition shapes the free energy profiles of six diverse drug-like xenobiotics (amantadine, diclofenac, metoprolol, pindolol, ranitidine, scopolamine). Using the MemCross all-atom molecular dynamics (MD) protocol and Accelerated Weight Histogram (AWH) method, we simulated permeation across five binary lipid mixtures representative of human plasma membranes. Our findings reveal that permeation thermodynamics are co-driven by specific lipid structural features and the intrinsic molecular properties of the permeants. We developed multivariate models capable of predicting key thermodynamic parameters based on mechanistic descriptors quickly obtainable from MD simulations.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "MOLECULAR DYNAMICS INSIGHTS INTO STEROID MODULATION OF NMDA RECEPTORS", "Presenter": "Yuan Chang-Halabi", "Sex": "", "Presenter Affiliation": "Institute of Pharmaceutical and Medicinal Chemistry, Universität Münster", "Presenter Country": "Germany", "Presenter Email": "yuan.chang@uni-muenster.de", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Ion channels are embedded in complex lipid environments that modulate their structure, dynamics, and function. The membrane-mediated modulation of the N-methyl-D-aspartate receptor (NMDAR) has been recognized for decades; however, the underlying molecular mechanisms are not fully understood. This tetrameric glutamate-gated ion channel has been implicated in numerous neurological and neuropsychiatric disorders, including Alzheimer's disease and depression, while also posing significant challenges for the development of safe and selective therapeutics. Positive allosteric modulation of NMDARs has been proposed to involve specific receptor–steroid interactions with endogenous molecules such as pregnenolone sulfate and cholesterol, as well as synthetic steroid derivatives. Using molecular dynamics simulations, dynamic pharmacophore modeling, and allosteric network analysis, we aim to characterize the molecular determinants of steroid recognition and elucidate the mechanisms underlying positive allosteric modulation of NMDARs. This membrane-centric approach may facilitate the rational design of novel allosteric modulators of NMDARs.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "MOLECULAR DYNAMICS OF NEURONAL MEMBRANES AND ION CHANNELS UNDER ULTRASOUND AND LASER STIMULATION", "Presenter": "Phuong H. NGUYEN", "Sex": "Female", "Presenter Affiliation": "Laboratoire de Biochimie Théorique, UPR9080 CNRS et Université Paris Cité", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Altered membrane mechanics and ion channel dysfunction are key features of Alzheimer's disease (AD) pathology. In this talk, I will present molecular dynamics simulations that reveal how differences in membrane elasticity between healthy and AD neurons affect amyloid-beta (Aβ) interactions and the structural stability of ion channels. The first part will focus on equilibrium membrane properties, showing how reduced elasticity in AD membranes enhances Aβ binding and destabilizes channel conformation. In the second part, I will discuss how laser and ultrasound stimulation modulate membrane structure and ion transport. Specifically, laser can dissociate ion channels, while ultrasound induces pore formation and regulates ion current, offering a potential route for drug delivery and neuromodulation in AD treatment. These findings provide molecular-level insights into the altered biophysical properties of AD neuronal membranes and the therapeutic potential of non-invasive physical stimuli.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "MOLECULAR MECHANISM OF SIGNALING OF A LYSOSOMAL AMINO ACID TRANSCEPTOR", "Presenter": "Philémon VON GAUDECKER", "Sex": "Male", "Presenter Affiliation": "Intistute of integral biology of the Cell, Gif-sur-Yvette", "Presenter Country": "France", "Presenter Email": "philemon.vongaudecker@i2bc.paris-saclay.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "As lysosomes become more and more characterized as signaling hubs, new studies have shown that the lysosomal cationic amino acid transporter PQLC2 [1] is involved in the regulation of an emerging signaling pathway. PQLC2 responds to the cellular cationic amino acid deprivation by recruiting at the lysosomal membrane the C9orf72-SMCR8-WDR41 (or CSW) complex, known for its GAP activity and implication in different lysosomal functions, including autophagy [2]. Pull-down assays in cell cultures indicates that the CSW recruitment occurs via interaction of a protruding flexible loop of WDR41 and PQLC2, where aromatic residues in both proteins seem to play essential roles [3]. To understand PQLC2’s amino acid sensing and signaling role, the aim of our project is to characterize the structural elements of PQLC2/WDR41 interaction. For this, we aim to recapitulate in solution the interaction between PQLC2 and WDR41 with the long-term goal to determine the high-resolution structure of the complex.  We engineered a “consensus” sequence of PQLC2, to obtain purified PQLC2 protein with optimal stability in detergent micelles for biophysical and biochemical characterization. Using the engineered PQLC2, we are gathering the first structural information of PQLC2 by Cryo-EM in collaboration with the Biofisika Institute (Bilbao, Spain) where PQLC2 appear to form homo-oligomers. On the other hand, to greatly improve the yield of purification as well as the stability of the WDR41 in solution, we engineered a WDR41 mutant by deleting its C-terminal end - which is known to interact with SMCR8 in the CSW complex. Our stable engineered WDR41 “ΔC” shows specific binding to purified PQLC2 in both pull-down assays and microscale thermophoresis (MST) assays. Competition experiments using synthetic peptides mimicking the WDR41 flexible loop and the use of WDR41 mutants confirmed the essential role of aromatic residues in the loop of WDR41 in mediating WDR41/PQLC2 recognition. Interestingly, we also discovered an unexpected stabilization role of the N-terminal region of WDR41 on PQLC2/WDR41 complex formation.  Moreover, replacing four aromatic residues predicted to sit in the cytoplasmic-open cavity of PQLC2 also decreases the affinity between the two proteins. Overall, our results support a model of PQLC2/WDR41 association in which the flexible loop of WDR41 inserts into the cytosolic cavity of PQLC2, while the N-term stabilizes the complex.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "MOLECULAR MECHANISMS OF EXCITATORY GLYCINE RECEPTORS", "Presenter": "Anto CERASALE", "Sex": "Male", "Presenter Affiliation": "Institut de Biologie de l'Ecole Normale Supérieure (IBENS), Ecole Normale Supérieure, Université PSL, CNRS, INSERM", "Presenter Country": "France", "Presenter Email": "cerasale@bio.ens.psl.eu", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Within the ionotropic glutamate receptors (iGluR) family, GluN1/GluN3A forms an atypical subtype of NMDA receptors (NMDARs). Unlike conventional NMDARs, both the GluN3A and GluN1 subunits are insensitive to glutamate. Together they assemble as excitatory glycine-gated receptors (eGlyR), where both activation and desensitization are driven solely by glycine, resulting in highly distinctive functional properties. This unique activation mechanism results in rapid desensitization of receptor-mediated currents, although the underlying molecular mechanism remains poorly understood despite recent advances. Recent structural studies have revealed a substantial rearrangement of the ligand-binding domain (LBD) layer upon glycine binding, resembling the desensitized state of kainate receptors (KAR). It has also been observed that the N-terminal domain (NTD) of GluN3A is highly flexible, suggesting a potential role in modulating these conformational changes. To further explore the receptor function, we aim to characterize the different conformational states of the receptor as well as to identify the structural determinants governing activation and desensitization of eGlyR by integrating in silico, biomolecular, mutagenesis, pharmacological, and electrophysiological approaches.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "MOLECULAR MECHANISMS OF PROTEIN-ASSISTED PASSIVE PERMEATION", "Presenter": "Taoufiq BOURAKADI", "Sex": "Male", "Presenter Affiliation": "INSERM U1248 Pharmacology & Transplantation, Faculty of Pharmacy, University of Limoges", "Presenter Country": "France", "Presenter Email": "gabin.fabre@unilim.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Traditional modeling of passive permeation largely ignored the presence of transmembrane peptides, relegating them strictly to active transport roles. However, given the high protein density of biological membranes, permeants inevitably interact with transmembrane domains before entering the hydrophobic core. We investigated protein-assistance in the passive permeation of xenobiotics. Using biased all-atom molecular dynamics (MD) simulations, we evaluated the permeation of acetylsalicylic acid alongside four single-pass transmembrane domains (KALP15, KALP23, GFRAL, SEMA4D). Our results reveal that the permeant translocates significantly faster along peptide surfaces than through purely lipidic environments. More importantly, the molecular mechanisms driving this enhancement are not protein-specific, hinting at a generalized molecular effect. By demonstrating that transmembrane domains can facilitate passive diffusion, this work opens the door to question current permeation paradigms and introduces a new parameter to consider for future pharmacokinetic modeling and drug development.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "MULTISCALE MODELLING OF CD9 CONFORMATIONAL DYNAMICS AND MEMBRANE REMODELING", "Presenter": "Irene CADENELLI", "Sex": "Female", "Presenter Affiliation": "Department of Physics, University of Genoa, and INFN, Sezione di Genova", "Presenter Country": "Italy", "Presenter Email": "irene.cadenelli@edu.unige.it", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Extracellular vesicles are nanoscale membrane-bound carriers involved in intercellular communication and in multiple physiological and pathological processes. The causal, mechanistic links among EV membrane composition, size, membrane protein organization, and biological function remain largely to be elucidated. Tetraspanins are key markers and structural regulators of extracellular vesicles, contributing to the formation of a dynamic interaction platform known as the tetraspanin web. Here, we focus on CD9, a member of the tetraspanin family, and develop a coarse-grained Martini 3 multistate model able to represent distinct conformational states of the protein. We use atomistic and coarse-grained simulations in a multiscale workflow to characterize CD9 conformational variability and protein–lipid interactions in a homogeneous POPC membrane and in an EV-like asymmetric membrane. We quantify the effect of a single and multiple CD9s on membrane mechanics using the sticky-tape set-up and local mechanical descriptors. We find that CD9 molecules perturb bilayer shape, curvature, and elastic properties. In particular, we quantify how CD9 modulates local tilt and splay elastic moduli, while separately probing curvature generation and curvature sensing as distinct membrane-remodeling mechanisms. Our results reveal a decoupling between these two behaviors: CD9 preferentially partitions to positively curved membrane regions, in line with experimental evidence for curvature sensing by tetraspanins, while its curvature-generating effect shifts the membrane towards negative curvature.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Delemotte"}, {"Title": "MYCOBACTERIAL WAG31 MEDIATES POLAR ORGANISATION AND CELL SHAPE BY INTERACTION WITH CONSERVED TRANSMEMBRANE PARTNERS", "Presenter": "Gabriel BRUNK", "Sex": "Male", "Presenter Affiliation": "Institut Pasteur, Université Paris Cité, CNRS UMR 3528, Bacterial Cell Cycle Mechanisms Unit", "Presenter Country": "France", "Presenter Email": "gabriel.brunk@pasteur.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "The bacterial cell cycle requires a tight coordination of incorporation of new cell wall material at sites of elongation and division. While common model organisms like Escherichia coli and Bacillus subtilis elongate laterally, Mycobacteriales, including major human pathogens like Mycobacterium tuberculosis and Corynebacterium diphtheriae, elongate from their cell poles. This polar growth is mediated by the elongasome machinery, organized around the essential conserved DivIVA-domain scaffolding protein Wag31, whose molecular mechanisms remain poorly understood despite more than two decades of research. The membrane recruitment mechanism for DivIVA-domain proteins was thought to originate from a small peripheral membrane-binding loop at the tip of the DivIVA dimer in a membrane curvature- and lipid composition-dependent manner. However, using Corynebacterium glutamicum as a model organism for M. tuberculosis, we showed that the DivIVA-domain of Wag31 is indispensable for proper localization of Wag31 but surprisingly independent of membrane recognition. Using mass-spectrometry-based interactomics and AlphaFold pull-down analyses, we identified two conserved transmembrane proteins, Wip1 and Wip2, that directly interact with Wag31. These proteins, which are essential in Mycobacterium tuberculosis, share two common and highly conserved motifs that mediate direct binding with the DivIVA-domain. Using structural and in vivo approaches, we demonstrate that these proteins are required for proper Wag31 localization, cell morphology, and normal cell cycle progression. We present a revised model in which Wag31 is actively recruited to and retained near the polar and septal membrane through direct protein-protein interactions, independent of membrane curvature.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "NANOPARTICLE-MEDIATED MEMBRANE FUSION: INTERPLAY OF MEMBRANE CURVATURE AND NANOPARTICLE SIZE", "Presenter": "Annalisa RELINI", "Sex": "Female", "Presenter Affiliation": "University of Genoa, Department of Physics", "Presenter Country": "Italy", "Presenter Email": "Annalisa.Relini@unige.it", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "The ability to induce membrane fusion in vitro has become a major goal in synthetic biology. Amphiphilic gold nanoparticles (AuNPs) embedded in zwitterionic lipid vesicles can act as a minimal synthetic fusion machinery tuned by calcium ions. However, very little is known about the physical determinants that regulate this fusion process. Here, we investigate the roles of lipid membrane curvature and amphiphilic nanoparticle size. We used AuNPs with the same amphiphilic coating but different core diameters (~2 nm and ~4 nm), interacting with DOPC/cholesterol unilamellar vesicles of different membrane curvatures. Using fluorescence spectroscopy assays, dissipative quartz microbalance, and molecular dynamics simulations, we found that small AuNPs promote vesicle fusion regardless of the membrane curvature, while large AuNPs, hindering the progression from the stalk state to the hemifusion state, are not fusogenic with low curvature membranes and can induce fusion events only with significantly curved membranes. These findings offer novel insights into the rational design of synthetic fusion strategies.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "NUMERICAL MODELING OF NEMATIC MEMBRANES WITH ACTIVE ANISOTROPIC INCLUSIONS", "Presenter": "Mitja DRAB", "Sex": "Male", "Presenter Affiliation": "University of Ljubljana", "Presenter Country": "Slovenia", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Biological membranes are active, multicomponent systems whose shape emerges from a complex interplay between curvature-inducing inclusions, in-plane ordering, and cytoskeletal forces. In this talk, I present a numerical framework for modeling closed membranes populated by curved anisotropic components that interact via nematic alignment and couple to active forces. Our simulations reveal a rich landscape of membrane morphologies arising from the competition between intrinsic curvature, nematic interactions, and active stresses. We show how nematic alignment organizes curved inclusions into defect structures that localize in regions of high curvature, thereby guiding membrane remodeling and stabilizing complex shapes such as tubules, necks, and pearled structures. Active forces further drive the system out of equilibrium, enabling transitions to morphologies that are inaccessible in passive systems, including flattened, protrusive, and dynamically fluctuating states. These results provide a unified physical picture of how curvature, orientational order, and active forces cooperate to control membrane shape, with implications for processes ranging from endocytosis and phagocytosis to cell spreading and motility.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "PHOTOREACTIVE COUMARINS FOR PEPTIDE-MEMBRANE INTERACTIONS USING FLUORESCENCE IMAGING AND MASS SPECTROMETRY", "Presenter": "Julien DE CLERCQ", "Sex": "Male", "Presenter Affiliation": "Chimie Physique et Chimie du Vivant (CPCV) – UMR 8228 – CNRS – ENS-PSL – Sorbonne Université", "Presenter Country": "France", "Presenter Email": "julien.de_clercq@sorbonne-universite.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Antimicrobial peptides (AMPs) and cell-penetrating peptides (CPPs) are membrane-active molecules with antibacterial and delivery properties. Getting insights into the interactions that underlie their biological activity is crucial to design new sequences with enhanced properties. These weak interactions can be studied by photoaffinity labeling coupled to mass spectrometry (PAL-MS), incorporating the photoreactive moiety on peptidic sequences. This project aims to develop synthetically modified lipids bearing photoreactive moieties on their polar head. Furthermore, we will combine UV photoreactivity and fluorogenicity through the design of original bifunctional hybrids based on coumarins. Combining spatial localization information with classical PAL-MS methods will allow to better understand peptide behavior.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "POLLUTED MEMBRANES UNDER HIGH PRESSURE: A NEUTRON SCATTERING STUDY", "Presenter": "Judith PETERS", "Sex": "Female", "Presenter Affiliation": "University Grenoble Alpes, CNRS, LiPhy", "Presenter Country": "France", "Presenter Email": "jpeters@ill.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Plastic pollution is widely recognized for its visible impact on oceans and wildlife, but less attention is given to the molecular byproducts that arise as plastics degrade. Among these, styrene oligomers (SOs)—small molecules released from polystyrene—may pose hidden risks to living systems, including under the high pressures of deep ocean environments where plastic degradation products have been detected. We investigated how SOs interact with model cell membranes composed of dipalmitoylphosphatidylcholine (DPPC). Using neutron reflectivity, neutron diffraction, and molecular dynamics simulations at both ambient and elevated pressures, we found that SOs disrupt the structural organization of lipid bilayers and weaken the membrane’s fluid-to-gel phase transition. These results highlight how plastic-derived molecules can subtly compromise biomembrane stability and function, even under extreme conditions.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "POSITIVE ALLOSTERIC MODULATION OF THE METABOTROPIC GLUTAMATE RECEPTOR 5", "Presenter": "Weronika CHOJNACKA", "Sex": "Female", "Presenter Affiliation": "IGF, Université de Montpellier, CNRS, Inserm", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "The metabotropic glutamate receptor 5 (mGlu₅) is widely expressed in the brain, where it modulates synaptic plasticity and plays important roles in physiological and pathological processes, such as learning, memory, and schizophrenia. Upregulation of mGlu₅ using positive allosteric modulators (PAMs) can treat most of the symptoms observed in preclinical models of schizophrenia. However, none of the PAMs developed so far have reached clinical trials, mainly due to adverse effects associated with intricate mGlu₅ signaling. We recently solved cryo-EM structures of mGlu₅ bound to several PAMs with different chemical structures and pharmacological properties, revealing the diversity of PAM binding modes within the mGlu₅ 7TM and their impact on mGlu₅ receptor conformations. Based on this structural information, we searched for new PAMs with original structures, in vitro and in vivo biological activity. We performed an in silico screening of the Enamine Hit Locator Library and selected 100 compounds for testing in vitro biological activity, out of which PAM-27 induces IP₁ production and calcium mobilization. To further optimize the PAM-27 properties, we aimed at characterizing its binding mode at the allosteric binding site. We solved the PAM27-bound mGlu₅ receptor by cryo-EM and refined its binding mode using alanine mutant and molecular pharmacology. Finally, PAM-27 displays in vivo activity in a preclinical model of schizophrenia (Disc-1 L100P mutant) and offers a promising scaffold to develop molecules with antipsychotic properties.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "PRODUCTION OF MATCHOUT-DEUTERATED CHOLESTEROL AND ITS DERIVATIVES FOR NEUTRON SCATTERING STUDIES", "Presenter": "Krishna Chaithanya BATCHU", "Sex": "Male", "Presenter Affiliation": "Institut Laue-Langevin", "Presenter Country": "France", "Presenter Email": "batchu@ill.fr", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "Selective deuteration of biomolecules is a powerful strategy for neutron scattering studies, enabling contrast variation experiments that reveal the structure and dynamics of complex biological systems. In this work, we present a robust protocol for the production of matchout-deuterated cholesterol, possessing a neutron scattering length density matched to 100% D₂O, together with deuterated sterol intermediates from the cholesterol biosynthesis pathway. The sterols, including cholesterol, 7-dehydrocholesterol (7-DHC), zymosterol, cholesta-5,7,14,24(25)-tetraenol, and cholesta-7,24(25)-dienol, were produced in a genetically engineered Pichia pastorisstrain grown in deuterated media with non-deuterated glycerol as the carbon source to precisely control the level of deuteration. Mass spectrometry and ¹H NMR confirmed approximately 89% deuteration of cholesterol, corresponding to 41 deuterium and five protium atoms. The neutron match point was experimentally verified using small-angle neutron scattering. The resulting matchout cholesterol was applied in neutron reflectometry studies of supported phosphatidylcholine lipid bilayers comprising saturated and unsaturated lipids with varying acyl chain lengths. These measurements demonstrated that cholesterol adopts an asymmetric distribution within the membrane, residing closer to the phospholipid headgroup region than to the bilayer center, irrespective of phosphatidylcholine composition.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "REGIMES OF PEARLING DYNAMICS IN TUBULAR VESICLES", "Presenter": "Maksim SHISHKIN", "Sex": "Male", "Presenter Affiliation": "Landau Institute for Theoretical Physics of RAS", "Presenter Country": "Russia", "Presenter Email": "max.shishckin2011@gmail.com", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Pearling converts membrane tubes into beads joined by thin tethers. We combine linear stability analysis and axisymmetric simulations to study pearling under different stretching protocols. In an extensional flow, marginal initial perturbations make pearls form first near the vesicle center, as observed by Kantsler et al., rather than through the end-to-center front found by Narsimhan et al. Above the critical strain rate for loss of metastability in an extensional flow, unbounded elongation rapidly increases tension until pearling becomes inevitable. Continued stretching of the connecting tethers causes secondary instabilities and a cascade of progressively smaller beads. By contrast, an approximately constant end force can balance Helfrich elasticity, creating a quasi-stationary chain of long-lived pearls. Individual “free pearls” are soliton-like solutions of the stationary force-balance equation. Their equilibrium tension decreases with radius, driving slow fluid transfer from smaller to larger pearls.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "REGULATION OF SERCA BY MEMBRANE POLYPEPTIDES", "Presenter": "Gianluigi VEGLIA", "Sex": "Male", "Presenter Affiliation": "University of Minnesota, Biochemistry, Molecular Biology and Biophysics", "Presenter Country": "USA", "Presenter Email": "vegli001@umn.edu", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Calcium homeostasis is fundamental to heart muscle contraction and is primarily maintained by the sarcoplasmic reticulum Ca²⁺-ATPase (SERCA), which is responsible for the bulk of intracellular calcium transport in humans. The activity of SERCA is finely regulated by a family of single-pass membrane peptides known as regulins, which ensure calcium levels remain within a precise physiological range. Disruption of this regulation has been implicated in the development of cardiomyopathies and heart failure. Among these regulins, phospholamban and DWORF play crucial but opposing roles in the beat-to-beat modulation of cardiac contractility. Unphosphorylated phospholamban inhibits SERCA by decreasing its affinity for calcium, whereas phosphorylation by protein kinase A lifts this inhibition and restores SERCA function. In contrast, DWORF enhances SERCA activity independently of β-adrenergic signaling. Notably, overexpression of DWORF can displace phospholamban and rescue impaired cardiac contractility, yet the molecular mechanism underlying SERCA activation by DWORF remains poorly understood. Here, we employ NMR spectroscopy and molecular dynamics simulations to dissect the molecular mechanisms governing both the activation and deactivation of cardiac SERCA.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ung"}, {"Title": "REMORIN-MEDIATED PROTEIN-LIPID NETWORKING DURING NANODOMAIN FORMATION IN PLANT CELLS", "Presenter": "Zeren XU", "Sex": "Female", "Presenter Affiliation": "Univ. Bordeaux, CNRS, Bordeaux INP, CBMN, UMR 5248", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral or poster", "Employment": "Unknown", "Abstract": "Biological membranes are highly dynamic platforms that can regulate essential cellular processes through the recruitment and organization of peripheral membrane proteins into functional supramolecular assemblies. In plants, remorins are multifunctional proteins, regulating immunity, development, and symbiosis. Their biological functions depend on membrane association, where they sequester specific lipids into functional membrane nanodomains. By integrating solution and solid-state NMR spectroscopy, advanced molecular imaging, and molecular dynamics simulations, we uncover the structural principles that govern remorin membrane recognition, self-assembly, and biological function. We show that remorins form coiled-coil oligomeric pre-assemblies decorated with a dynamic, fuzzy region and a barcode-like distribution of positively charged residues prior to membrane binding. Membrane association then promotes lipid sequestration, modulates membrane biophysical properties, and reorganizes the electrostatic landscape at the protein–membrane interface. Together, our findings provide a molecular framework for understanding how remorins couple protein self-assembly with lipid organization to generate functional membrane nanodomains.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "SARS-COV-2 NUCLEOCAPSID PROTEIN ENGAGES WITH VIRAL RNA AND ERGIC LIPIDS TO DRIVE VIRAL CORE ASSEMBLY", "Presenter": "Cyril FAVARD", "Sex": "Male", "Presenter Affiliation": "Institut de Recherche en Infectiologie de Montpellier, IRIM, CNRS & University of Montpellier", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Severe acute respiratory syndrome coronavirus 2 assembles at the ER–Golgi intermediate compartment (ERGIC), yet the molecular basis of nucleocapsid (N) protein interactions with host membranes remains unclear. Using in vitro reconstituted lipid membranes and viral RNA–N complexes, we confirm that full-length N binds phosphatidylinositol (PI)- and phosphatidylserine (PS)-containing membranes and, in addition, show that N induces lipid clustering upon self-interacting on membranes. The isolated N-terminal domain of N protein lacks this activity, whereas its C-terminal domain retains membrane-associated self-assembly and lipid sorting. Even on simple lipid bilayer compositions, we observe co-clustering of N and PI lipids, facilitating ribonucleoprotein (RNP) assembly on membranes. Furthermore, we show that ERGIC-mimicking membranes enhance PS-RNP co-clustering to dimensions matching the viral core size. Finally, we observed in cells that the presence of viral RNA favors N clustering that can be located on ERGIC. These findings reveal cooperative interactions between N, viral RNA, and ERGIC lipids as key drivers of lipid-dependent viral core formation, providing a mechanistic framework for the early steps of viral assembly.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ambrosetti"}, {"Title": "SILVER RESISTANCE IN GRAM-NEGATIVE BACTERIA: INITIAL CHARACTERIZATION OF THE METAL TRANSPORTER SILP", "Presenter": "Estelle CAMPANIELLO", "Sex": "Female", "Presenter Affiliation": "Université Paris-Saclay, CEA, CNRS, Institute for Integrative Biology of the Cell (I2BC)", "Presenter Country": "France", "Presenter Email": "guillaume.lenoir@i2bc.paris-saclay.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Silver (Ag⁺) is currently one of the most widely used metals to combat microbial infections. The antibacterial properties of Ag⁺ are the result of various processes, including its ability to disrupt transcription or to substitute for other metals present in metalloenzymes. However, some Gram-negative bacteria have acquired a resistance mechanism based on active efflux systems that export silver ions from the cytosol. Silver resistance is mediated by the sil operon, which encodes nine proteins, among which SilP, a P1B-type ATPase predicted to export Ag⁺. To date, the structure and function of SilP remain largely unexplored. This project aims to elucidate the molecular mechanism of Ag⁺ transport by SilP. Toward that goal, SilP was expressed in Escherichia coli as an eGFP fusion protein, enabling purification by affinity chromatography using anti-GFP nanobodies. Optimized expression and purification conditions yielded sufficient

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submitted Abstracts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-raised:#FFFDF9;
    --ink:#1E2230;
    --ink-soft:#5B5F6E;
    --rule:#DCD5C4;
    --accent:#5C6F4D;      /* moss */
    --accent-soft:#E6EADD;
    --plum:#6E4C6B;        /* secondary accent for poster/type */
    --plum-soft:#EFE3EE;
    --amber:#A9722C;       /* status accent */
    --amber-soft:#F3E5D0;
    --focus:#2F5FB3;
    --shadow: 0 1px 2px rgba(30,34,48,0.06), 0 4px 14px rgba(30,34,48,0.05);
  }

  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    line-height:1.5;
  }

  a{color:inherit;}

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:56px 24px 120px;
  }

  header.page{
    margin-bottom:36px;
    border-bottom:1px solid var(--rule);
    padding-bottom:28px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:clamp(32px, 5vw, 44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }

  .page-sub{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
  }

  /* ---- controls ---- */
  .controls{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    padding:18px 0 16px;
    border-bottom:1px solid var(--rule);
    margin-bottom:22px;
  }

  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }

  .search-row input[type="search"]{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:11px 14px;
    border:1px solid var(--rule);
    border-radius:8px;
    background:var(--paper-raised);
    color:var(--ink);
  }
  .search-row input[type="search"]:focus{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }

  .filters select{
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:8px 30px 8px 12px;
    border:1px solid var(--rule);
    border-radius:20px;
    background:var(--paper-raised) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%235B5F6E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
    -webkit-appearance:none;
    appearance:none;
    color:var(--ink);
    cursor:pointer;
  }
  .filters select:focus{ outline:2px solid var(--focus); outline-offset:1px; }

  .clear-btn{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    background:none;
    border:1px solid transparent;
    padding:8px 10px;
    cursor:pointer;
    text-decoration:underline;
  }
  .clear-btn:hover{ color:var(--ink); }

  .result-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin:14px 2px 18px;
  }

  /* ---- cards ---- */
  .card-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .card-head{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:18px 20px;
    cursor:pointer;
    text-align:left;
    width:100%;
    background:none;
    border:none;
    font:inherit;
    color:inherit;
  }
  .card-head:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:-2px;
  }

  .toggle-icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    transition:transform .2s ease, background .2s ease;
    font-size:11px;
  }
  .card.open .toggle-icon{
    transform:rotate(90deg);
  }

  .card-main{
    flex:1 1 auto;
    min-width:0;
  }

  .card-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  .card-title{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:18px;
    line-height:1.32;
    margin:3px 0 6px;
  }

  .card-meta{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
  }
  .card-meta .presenter-name{
    color:var(--ink);
    font-weight:600;
  }

  .tags{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    padding-top:2px;
  }

  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .tag-sex{ background:#EDEDED; color:#4B4B4B; }
  .tag-sex.female{ background:var(--plum-soft); color:var(--plum); }
  .tag-sex.male{ background:#DDE6F0; color:#2F5FB3; }

  .tag-type{ background:var(--accent-soft); color:var(--accent); }
  .tag-status{ background:var(--amber-soft); color:var(--amber); }

  .tag-decision{ background:#E5EEF5; color:#2F5FB3; font-weight:600; }
  .tag-decision.decision-poster{ background:var(--plum-soft); color:var(--plum); }
  .tag-decision.decision-discuss{ background:#F0EBDD; color:#8A6D1F; }

  .tag-session{ background:#E8E4F7; color:#4B3F91; }

  .abstract{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .25s ease;
  }
  .card.open .abstract{
    grid-template-rows:1fr;
  }
  .abstract-inner{
    overflow:hidden;
  }
  .abstract-body{
    padding:0 20px 20px 56px;
    border-top:1px solid var(--rule);
    margin-top:2px;
    padding-top:14px;
  }
  .abstract-body p{
    margin:0 0 10px;
    font-size:14.5px;
    color:var(--ink);
    max-width:68ch;
  }
  .abstract-body .extra-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:12px;
  }
  .abstract-body .extra-meta span{
    display:inline-block;
    margin-right:14px;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'Source Serif 4', serif;
    font-size:17px;
    border:1px dashed var(--rule);
    border-radius:10px;
  }

  footer.page{
    margin-top:48px;
    padding-top:20px;
    border-top:1px solid var(--rule);
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }

  @media (max-width:560px){
    .card-head{ flex-wrap:wrap; }
    .tags{ flex-direction:row; align-items:center; width:100%; padding-left:36px; }
    .abstract-body{ padding-left:20px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="page">
    <p class="eyebrow">Conference Abstract Review</p>
    <h1>Submitted Abstracts</h1>
    <p class="page-sub">Browse, search and filter submitted abstracts. Click a card to read the full abstract.</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="Search by title, presenter, affiliation or abstract text…" aria-label="Search abstracts">
    </div>
    <div class="filters" id="filters">
      <select id="filterSex" aria-label="Filter by sex">
        <option value="">Sex — All</option>
      </select>
      <select id="filterType" aria-label="Filter by presentation requested">
        <option value="">Requested — All</option>
      </select>
      <select id="filterStatus" aria-label="Filter by employment">
        <option value="">Employment — All</option>
      </select>
      <select id="filterCountry" aria-label="Filter by country">
        <option value="">Country — All</option>
      </select>
      <select id="filterDeadline" aria-label="Filter by submission round">
        <option value="">Deadline — All</option>
      </select>
      <select id="filterDecision" aria-label="Filter by decision">
        <option value="">Decision — All</option>
      </select>
      <select id="filterSession" aria-label="Filter by session speaker">
        <option value="">Session — All</option>
      </select>
      <button class="clear-btn" id="clearFilters">Clear filters</button>
    </div>
  </div>

  <p class="result-count" id="resultCount"></p>

  <div class="card-list" id="cardList"></div>

  <div class="empty-state" id="emptyState" style="display:none;">No abstracts match your search.</div>

  <footer class="page">Conference abstract review · <span id="totalCount"></span> submissions loaded</footer>

</div>

<script>
// __ABSTRACT_DATA__
const ABSTRACTS = [{"Title": "A CHOLESTEROL-DRIVEN COMPOSITIONAL CROSSOVER TUNES THE PHYSICAL STATE OF PHASE-SEPARATED LIPID MEMBRANES", "Presenter": "Loredana CASALIS", "Sex": "Female", "Presenter Affiliation": "Università degli Studi di Trieste, Physics Department", "Presenter Country": "Italy", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Because lipid rafts regulate the spatial organization of receptors, signalling complexes, and membrane trafficking, understanding their cholesterol-dependent physical basis is increasingly important, particularly as altered plasma-membrane cholesterol organization is implicated in cancer progression. Here, we investigate supported lipid bilayers composed of a biomimetic quaternary mixture (DOPC/DPPC/SM/cholesterol) containing 7–33 mol% cholesterol. By combining AFM imaging, force spectroscopy, FRAP, calorimetry, and neutron spin-echo spectroscopy, we resolve membrane structure, mechanics, and dynamics across multiple length and time scales. We identify a compositional crossover near 25 mol% cholesterol that separates two distinct physical regimes. Below this threshold, the membrane exhibits strong phase separation, characterized by a large thickness mismatch, high line tension, pronounced mechanical contrast, and slow diffusion within liquid-ordered domains. Above the crossover, the thickness mismatch decreases rapidly, while the structural, mechanical, and dynamical contrast between liquid-ordered (Lo) and liquid-disordered (Ld) phases progressively collapses. AFM force spectroscopy reveals a convergence of rupture forces between the Lo and Ld phases, whereas FRAP measurements show increased molecular mobility within ordered domains, consistent with reduced interfacial constraints. Analysis of domain boundaries further reveals a minimum in line tension near the crossover, indicating reduced interfacial energy. Neutron spin-echo spectroscopy additionally identifies cholesterol-dependent changes in collective membrane fluctuations at nanometre length scales, demonstrating that the crossover extends from lateral membrane organization to collective dynamics. Together, these results show that cholesterol does not simply stabilize ordered domains, but drives a cholesterol-driven compositional crossover that reshapes the membrane free-energy landscape. This crossover shifts the system from a strongly heterogeneous, high-contrast state to a mechanically convergent regime with reduced interfacial energy and diminished phase contrast. Our findings provide a unified multiscale framework linking membrane organization, mechanics, and collective dynamics, and suggest that biological membranes may operate near a compositional regime in which relatively small variations in cholesterol produce disproportionately large changes in raft organization and function. Defining this regime may therefore be relevant for understanding pathological alterations in membrane signalling and for developing strategies aimed at modulating raft-dependent cellular processes.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "A DUAL STRATEGY COMBINING SPECTRAL SHIFT SCREENING AND COARSE-GRAINED MOLECULAR DYNAMICS FOR A2AR", "Presenter": "Kerstin Kanonenberg", "Sex": "Female", "Presenter Affiliation": "Eurofins CALIXAR", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "The Adenosine A₂A Receptor (A₂AR) was selected as a representative GPCR to establish an integrated fragment-based discovery workflow capable of screening fragments on the active receptor state. This workflow combines Spectral Shift screening, coarse-grained Martini 3 molecular dynamics (MD) simulations, and computational chemistry to efficiently identify and validate fragment hits. Using this approach, we discovered several fragment binders that were subsequently confirmed using thermal shift and cellular assays, providing mechanistic insight into both receptor flexibility and fragment interaction patterns. Importantly, this integrated strategy identified multiple non-purine scaffolds as promising chemical starting points for ligand optimization. Spectral Shift technology played a central role by enabling fragment screening directly on active GPCR while maintaining native protein conformation, offering higher throughput and dramatically lower protein consumption than traditional biophysical approaches such as NMR or SPR. In parallel, unbiased coarse-grained MD simulations captured long-timescale receptor dynamics and rapidly revealed potential fragment-binding hotspots, effectively narrowing down high-value regions of chemical space. These simulations also proved predictive, as suggested fragments were experimentally identified in Spectral Shift assays. Together, this workflow provides an innovative, practical, and scalable solution for fragment-based GPCR drug discovery. Beyond accelerating early hit identification, it can serve as a prospective strategy to assess the likelihood of finding hits within focused or sub-libraries prior to initiating experimental campaigns, ultimately strengthening Integrated Drug Discovery efforts for complex membrane proteins.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "A KEYSTONE INTERACTION IN THE ASSEMBLY OF THE TYPE VI SECRETION SYSTEM MEMBRANE COMPLEX IN B. FRAGILIS", "Presenter": "Ahmed HAYDA", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Chimie Bactérienne (LCB)", "Presenter Country": "France", "Presenter Email": "edurand@imm.cnrs.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "The Type VI Secretion System (T6SS) is a bacterial nanomachine essential for interbacterial competition through secretion of antagonistic effectors into the target. This nanomachine requires a specialized membrane complex (MC) to anchor the machinery to the cell envelope and allow the passage of the \"poisoned harpoon\" (i.e., the effector-loaded Hcp tube) through the double membrane. While Proteobacteria possess a characterized MC (TssJLM), Bacteroidetes encode a distinct, non-homologous MC (TssNQOPR) whose assembly and functional architecture remain poorly studied. In our latest work, we investigated core protein-protein interactions within the Bacteroidetes MC: the TssR von Willebrand Factor A (VWA) domain and the TssP C-terminal domain (CTD). We characterized this interaction through co-purification, isothermal titration calorimetry, and native mass spectrometry. We validated the Alphafold structural predictions through directed mutagenesis, demonstrating that mutations at the predicted interface abolish binding. Finally, we explored the evolutionary intricacies of these domains and their phylogeny to understand how they emerged and evolved. In this study, we showcased the first direct biochemical evidence of an interaction between two essential T6SS MC components in Bacteroides fragilis.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ung"}, {"Title": "A MEMBRANE-DISRUPTIVE ACTION OF VBIT-4 CHALLENGES ITS ROLE AS A WIDELY USED VDAC OLIGOMERIZATION INHIBITOR", "Presenter": "Varun Ravishankar", "Sex": "Male", "Presenter Affiliation": "Laboratoire d'Ingénierie des Systèmes Macromoléculaires, CNRS, UMR 7255 - Aix Marseille Université", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "The voltage-dependent anion channel (VDAC) is the most abundant protein of the mitochondrial outer membrane and plays a central role in metabolism and apoptosis. Its oligomerization has been proposed to mediate critical processes, including mtDNA release and apoptotic signaling. The small molecule VBIT-4 has been widely used over the past decade as an inhibitor of VDAC1 oligomerization, yet its molecular mechanisms remain poorly defined. Here, we combined high-speed atomic force microscopy, single-channel electrophysiology, fluorescence spectroscopy, microscale thermophoresis, and molecular dynamics simulations to investigate its mode of action. We show that VBIT-4 partitions into lipid bilayers with micromolar affinity, where it perturbs lipid packing, decreases bilayer thickness, and induces lipid flip-flop and pore-like defects. AFM directly visualized VBIT-4 localizing to protein-free lipid regions, leaving VDAC1 clusters unaffected, while electrophysiology confirmed membrane permeabilization at concentrations ≥20 µM. These membrane-disruptive effects occurred independently of VDAC1 and were accompanied by VDAC1-independent cytotoxicity in HeLa cells, including mitochondrial depolarization and impaired calcium homeostasis. Importantly, VBIT-4’s ability to alter lipid organization provides an explanation for previously reported reductions in VDAC cross-linking, which likely arise from lipid-driven rearrangements of VDAC clusters rather than inhibition of discrete protein–protein oligomers. Our findings establish that VBIT-4 is not a specific inhibitor of VDAC oligomerization. Rather, it is a membrane-active compound whose effects result from the modulation of membrane-dependent protein interactions. This work further reveals the risk of broad off-target effects, calling for caution in interpreting prior studies that have employed VBIT-4 and underscores the necessity of using lipid-based controls when evaluating small molecules that target membrane proteins.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "ADSORPTION OF LIPID BILAYERS TO MONOLAYERS - A NEW TRIPLE LAYER SYSTEM FOR STUDYING MEMBRANE PROTEINS", "Presenter": "Christian SCHWIEGER", "Sex": "Male", "Presenter Affiliation": "Martin Luther University Halle-Wittenberg, Institute of chemistry", "Presenter Country": "Germany", "Presenter Email": "Christian.schwieger@chemie.uni-halle.de", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Lipid monolayers can be used as a very simple model system for one membrane leaflet. They have the advantages of being perfectly oriented, completely hydrated, and accessible through the aqueous phase. Thus, they are well suited for interaction studies with membrane-binding compounds, such as proteins or peptides. However, no membrane-spanning molecules can be studied in this system until now. Therefore, we are aiming to design a new membrane model system that makes the many advantages of established monolayer methods accessible for more complex samples. We are exploring methods to assemble lipid bilayers underneath lipid monolayers at the air-water interface. The bilayers will be oriented, allowing the deduction of molecular orientations from experiments, while still being in a well-hydrated and natural environment. We will present successful attempts in constructing such a model system, i.e., the adsorption of different lipid nanodiscs or vesicles to lipid monolayers at the air-water interface.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Heath"}, {"Title": "ANTIBODIES COUPLED TO LIPOPHILIC DYES ENABLE HIGH-DENSITY MEMBRANE LABELING IN SUPER-RESOLUTION AND EXPANSION MICROSCOPY", "Presenter": "Manuel ROJO", "Sex": "Male", "Presenter Affiliation": "Institut de Biochimie et Génétique Cellulaires (IBGC), UMR 5095 CNRS – Université de Bordeaux", "Presenter Country": "France", "Presenter Email": "manuel.rojo@ibgc.cnrs.fr", "Presentation Requested": "Oral or poster", "Employment": "Unknown", "Abstract": "Classical immunolabelling approaches can achieve homogeneous and continuous labeling of cellular membranes and organelles at wide-field and confocal resolution. In super-resolution and expansion microscopy, however, the lack of high-density labels hampers the localization of membrane proteins and protein complexes within their membrane context. We show that secondary antibodies coupled to lipophilic dyes ATTO 647N or ATTO 550 brightly label the nuclear envelope, mitochondria, and endoplasmic reticulum of fixed, permeabilized cells, and that graded labeling intensities allow selective visualization of organelles. State-of-the-art super-resolution and expansion microscopy reveal high-density labeling of nuclear and mitochondrial membranes, comparable to dedicated membrane-labeling approaches. We show that dye-conjugated IgG allow the resolution of mitochondria-ER contacts and mitochondrial ultrastructure as well as precise visualization of the nuclear envelope and its invaginations. This study shows that secondary antibodies conjugated to lipophilic fluorophores represent stable, convenient, and affordable tools for organelle visualization in conventional microscopy and for high-density labeling of membranes in super-resolution and expansion microscopy.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "BIOMIMETIC LIPID MEMBRANES AS TEMPLATES FOR STRUCTURING INORGANIC SILICA", "Presenter": "Lucien ROACH", "Sex": "Male", "Presenter Affiliation": "ENS de Lyon, CNRS, LCH, UMR 5182", "Presenter Country": "France", "Presenter Email": "lucien.roach@ens-lyon.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Diatoms are single-celled algae, ubiquitous in marine environments; notably, they have an exterior cell composed of intricately structured silica (frustule). The control and reproducibility of the hierarchical structuration seen in diatom frustules far exceed the current abilities of material sciences. Throughout frustule formation, the frustule remains in close contact with lipid membranes, with recent research suggesting that the membrane is an active participant in generating silica structuration. To address this gap, we have developed biomimetic lipid systems in which we use the formation of liquid-ordered (Lo) and liquid-disordered (Ld) domains to direct site-specific silica condensation. We used two model systems to do this: firstly, 2D supported lipid bilayers (SLBs) prepared through Langmuir-Blodgett deposition and studied using TIRF microscopy, where we monitored in real-time silica condensation kinetics, alongside the spatial organization of lipid domains and the deposited silica. We have evaluated the influence of headgroup composition on silica mineralization. Secondly, 3D giant unilamellar vesicles (GUVs) were used to produce structured silica shells. We have used fluorescence microscopy alongside NMR spectroscopy to track silica condensation and the chemical interactions between the lipids and silica. Ultimately, this work seeks to provide new insights into the mechanisms governing silica biomineralization and establish a new paradigm for the formation of hierarchically structured materials using phospholipid membranes as templates.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "CAPTURING THE DESENSITIZED CONFORMATION OF THE MUSCLE-TYPE NICOTINIC ACETYLCHOLINE RECEPTOR", "Presenter": "Manuela ZOONENS", "Sex": "Female", "Presenter Affiliation": "Université Paris Cité, CNRS, Biochimie des Protéines Membranaires", "Presenter Country": "France", "Presenter Email": "manuela.zoonens@ibpc.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "The nicotinic acetylcholine receptor (nAChR) from electric fish is a key model for understanding ligand-gated ion channel (pLGIC) function. Upon neurotransmitter binding, these receptors undergo successive conformational transitions from resting (closed-channel) to active (open-channel), and then desensitized (closed-channel) states. Recent structural data have clarified the coupling between agonist-induced changes in the extracellular domain (ECD) and motions of the pore-lining M2 a-helices in the transmembrane domain (TMD). However, agonist-bound Torpedo nAChR structures revealed lipid densities in the central pore, likely artefacts from reconstitution in protein-based nanodiscs. Moreover, molecular dynamics simulations show that these structures adopt a hydrated, ion-permeable pore, inconsistent with desensitization. To address this, we used amphipathic polymers (CyclAPol C₈-C₀-50) to directly extract nAChR from fish electric organ membranes. This allows us to bypass reconstitution steps and preserve the native lipid context, which proves to be enriched in docosahexaenoic acid (DHA)-containing phospholipids. The cryo-EM structure of amphipol-purified, agonist-bound nAChR differs from those obtained in protein-based nanodiscs: while agonist-bound ECD signatures are conserved, the TMD shows an a-M2 helix break, leading to the closure of hydrophobic pore gates, consistent with the expected desensitized state. This highlights the impact of the amphipathic environment on membrane protein structural studies and the need to compare different solubilization strategies to assess whether a given conformation is mimetic-specific or robust.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "CELL DIVISION PROTEINS OF ARCHAEA", "Presenter": "Maria HOERNKE", "Sex": "Female", "Presenter Affiliation": "Martin-Luther-Universität, Physical Chemistry", "Presenter Country": "Germany", "Presenter Email": "Maria.Hoernke@chemie.uni-halle.de", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "Archaea have developed an entirely different way of constructing their membranes compared to bacteria and eukarya, able to withstand harsh conditions (temperatures, salt, pH). Apart from general membrane behavior, we study the membrane binding of the cell division protein SepF and its binding partners. Archaeal lipid monolayers are examined by surface-sensitive infrared spectroscopy to yield mechanistic information. Furthermore, vesicles are used for biophysical characterization, including fluorescence spectroscopy for membrane packing and membrane permeabilization, and for the local organization of lipids and bound proteins. The project is funded by the European Social Fund Plus (ESF+) together with the Federal State of Saxony-Anhalt (Grant No. ZS/2024/09/189789 to MH).", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "CELL SURFACE TARGETING BY GAG-BINDING PEPTIDES", "Presenter": "Johannes MURRE", "Sex": "Male", "Presenter Affiliation": "Sorbonne Université, CPCV", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "Cell-Penetrating Peptides (CPPs) are short peptides that can enter cells by spontaneously crossing the plasma membrane, either by endocytosis or direct translocation through the lipid bilayer. Several natural CPPs correspond to the third helix of a highly conserved domain of homeoproteins, the so-called homeodomain. A GAG-binding sequence is found upstream of the CPP sequence in homeodomains, with different GAG specificity depending on the homeoprotein. For example, the homeodomain of the protein En2 encompasses a sequence interacting preferentially with HS, while the homeodomain of Otx2 carries a disulfated CS-binding sequence. GAGs are known to participate in the internalization of homeoprotein-derived CPPs, and we recently showed that chimeric peptides composed of a GAG-binding sequence and a CPP sequence have enhanced internalization in certain cell lines depending on their GAG expression. In order to quantitatively assess cell surface accumulation mediated by GAGs, we are currently developing a fluorescence-based assay with chimeric peptides composed of a GAG-binding sequence linked to a fluorogenic cell-surface protease peptide substrate. We are using the rate of substrate cleavage as a reporter of cell surface accumulation through GAGs. Ultimately, this will allow us to identify efficient GAG-binding sequences to design new chimeric CPPs with enhanced cell selectivity and internalization properties.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "CELLULAR INSERTION OF MEMBRANE PROTEINS FOR THEIR STRUCTURAL ANALYSIS USING NMR SPECTROSCOPY", "Presenter": "Noé IMLER", "Sex": "Male", "Presenter Affiliation": "Molecular Microbiology and Structural Biochemistry (MMSB), UMR 5086 CNRS-Université de Lyon", "Presenter Country": "France", "Presenter Email": "noe.imler@ibcp.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Solid-state NMR allows the study of insoluble proteins as membrane proteins. These membrane proteins are generally studied in a lipid native-like environment. One problem that remains today is how to study them directly in cells, to identify the impact of partner proteins and structural modifications induced by the cellular environment. In this context, nanodisc-based approaches allow the insertion of membrane proteins labeled for NMR, and thereby provide a way for the structural study of membrane proteins inside cells. The aim of this work is to establish the insertion of membrane proteins into cells, enabling NMR measurements in a more native-like environment. Our work initially focuses on the cell insertion of the model protein OmpX, produced in bacteria or with a wheat germ cell-free protein synthesis, using a nanodisc system. Best settings for optimizing insertion are being evaluated. The results are analyzed by fluorescence microscopy, FRET, and spectral flow cytometry. Two different nanodisc compositions were evaluated for insertion into a membrane bilayer model and eukaryotic cells using different incubation times and nanodisc concentrations. This nanodisc-mediated cell insertion of membrane proteins shall pave the way for the structural characterization of viral membrane proteins directly in cells.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "CHAIN-SPECIFIC LIPID DYNAMICS REVEAL AN ASYMMETRIC SKIN BARRIER MATRIX", "Presenter": "Oskar ENGBERG", "Sex": "Male", "Presenter Affiliation": "Institute of Medical Physics and Biophysics, Leipzig University", "Presenter Country": "Germany", "Presenter Email": "oskar.engberg@medizin.uni-leipzig.de", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "The skin barrier, the stratum corneum, is the body’s first line of defense against dehydration and environmental exposure. Its exceptional barrier function is usually attributed to a dense, low-permeability lipid matrix of approximately equimolar ceramides, free fatty acids, and cholesterol, which appears ordered and largely crystalline by X-ray diffraction. Yet this static view does not fully explain skin elasticity, swelling, enzymatic activity, or the incorporation of antimicrobial peptides, suggesting that alternative asymmetric lipid organization and dynamics may exist. Therefore, solid-state ²H NMR spectroscopy was used to quantify the molecular dynamics of deuterated skin barrier lipids and chain segments. Our results reveal that the skin barrier lipid matrix is not dynamically homogeneous. The sphingosine chain of Cer[NS] and cholesterol display fluid-like mobility, whereas the ω-linked polyunsaturated linoleate chain of ultralong Cer[EOS] undergoes isotropic motion. In contrast, saturated lignoceric acid and the acyl chain of Cer[NS] remain predominantly orthorhombic/rigid, consistent with an extended Cer[NS] conformation not observed in phospholipid membranes. These findings support asymmetric molecular segregation of lipid and chain-segment dynamics. To determine whether unsaturation in the ω-linked chain of Cer[EOS] is required for the native long-periodicity phase (LPP) barrier, we compared ultralong Cer[EOS] variants carrying native linoleate (2 double bonds), oleate (1 double bond), or saturated stearate (0 double bonds). Only unsaturated ω-linked chains preserved the isotropic mobility required for formation of the native LPP barrier. Together, these results suggest that asymmetric organization and chain-specific lipid mobility enable a more functionally diverse barrier than an exclusively rigid and symmetric lipid assembly could provide.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Heath"}, {"Title": "CHANNEL PROTEINS DRIVE MICELLAR INTERACTIONS WITH THE BACTERIAL OUTER MEMBRANE", "Presenter": "Amar Krishna GOPINATH", "Sex": "Male", "Presenter Affiliation": "Department of Chemical Engineering, Indian Institute of Science", "Presenter Country": "India", "Presenter Email": "ayappa@iisc.ac.in", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Recent studies report the abundance of integral membrane proteins in the outer membrane of Gram-negative bacteria, challenging the conventional lipid-centric models of membrane organization. This revised understanding of the architecture of the bacterial membrane necessitates a re-examination of how antimicrobial molecules interact with them and eventually permeate this complex biological barrier. Surfactants are one of the most widely used classes of antimicrobials in daily life, whose interactions with membranes are complicated by their tendency to aggregate as micelles. Using multiscale molecular dynamics simulations, we observe a preferential affinity for micelles to bind to channel proteins in the outer membrane, over lipids. Micelles are observed to bind to the extracellular loops of the channel protein OmpF to result in obstructed channeling of other small molecules. Interestingly, surfactants eventually break free from micelles in this bound state to move further into the channel, suggesting a mechanism through which surfactants permeate through porins despite initially assembling into micelles substantially larger than the pore diameter. We further examined the energetics of complete translocation of a surfactant through the channel by estimating the free energy associated with the process. Using the finite temperature string method, the free energy barrier observed for crossing the constriction region of the channel is examined in a multidimensional collective variable space. These calculations confirm significant affinity for surfactants to enter the channel, while crossing of the constriction region requires conformational acrobatics in the form of folding and flipping, leading to a barrier-crossing event. Using the above approach, our study provides new insights into how aggregation and structural properties of surfactants lead to differences in the mechanism by which they translocate complex membrane barriers.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "CHARACTERIZATION OF THE PSEUDOPALIN TRANSPORT PATHWAY VIA CNTI AND MEXB IN PSEUDOMONAS AERUGINOSA", "Presenter": "Quentin CECE", "Sex": "Male", "Presenter Affiliation": "Faculté de Pharmacie de Paris", "Presenter Country": "France", "Presenter Email": "quentin.cece@cnrs.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Metallostasis plays a major role in living systems. It is particularly relevant for pathogen bacteria at the microorganism-host interface where \"nutritional immunity\" is displayed. In metal-scarce conditions, a common bacterial strategy consists of the biosynthesis of metallophores, their export into the extracellular medium, and the recovery of a metal-metallophore complex through dedicated membrane transporters. In Pseudomonas aeruginosa, a gram-negative bacterium strongly involved in antibiotic resistance, a broad-spectrum nicotianamine-like metallophore named pseudopaline (Pp) has been shown to play a primary role in zinc uptake in a chelating environment. CntI exporter belongs to the drug/metabolite transporter (DMT) superfamily, which is ubiquitous and includes exporters for a remarkably wide range of substrates. In order to understand the molecular basis of Pp transport, the structural mechanism of Pp export by CntI across the inner membrane (IM) will be studied. Here we present our preliminary results on the CntI purification, the interaction study between CntI and MexB, and the development of a method for reconstituting our proteins into nanodiscs.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "CHARGE-DEPENDENT INSERTION OF THE ANTIMICROBIAL PEPTIDE MAGAININ-2 INTO LIPID MONOLAYERS", "Presenter": "Sophie COMBET", "Sex": "Female", "Presenter Affiliation": "Laboratoire Léon-Brillouin (LLB), UMR12 CEA, CNRS, Université Paris-Saclay", "Presenter Country": "France", "Presenter Email": "sophie.combet@cnrs.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Many antimicrobial peptides act by disrupting cellular membranes, with therapeutic selectivity arising from their ability to discriminate between bacterial and mammalian cells, a distinction largely governed by membrane surface charge. Here, we investigate the interfacial organization and membrane insertion of the cationic antimicrobial peptide magainin 2 using specular neutron reflectometry on lipid monolayers that mimic bacterial and mammalian membranes. Negatively charged dipalmitoylphosphatidylglycerol (DPPG) and zwitterionic dipalmitoylphosphatidylcholine (DPPC) were used as respective representative model systems. Experimental conditions were adjusted to compensate for the markedly different membrane association constants of magainin 2, enabling direct comparison of peptide behavior at the two interfaces. Despite similar peptide coverages, magainin 2 exhibits strikingly different interfacial behavior. At the DPPG interface, the magainin 2 α-helix inserts deeply and adopts an orientation parallel to the membrane surface, with hydrophobic residues facing the lipid chains and cationic residues interacting with the polar headgroups. In contrast, at the DPPC interface, the peptide displays limited interaction with the monolayer and a diffuse intensity distribution across the headgroup and acyl-chain regions, consistent with a largely disordered conformation. These results demonstrate that electrostatic interactions not only promote membrane binding but also dictate peptide insertion depth and interfacial organization.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "CHOLESTEROL OXIDATION ALTERS CRITICAL ALLOSTERIC INTERACTIONS BETWEEN GLYCINE TRANSPORTER 2 AND MEMBRANE CHOLESTEROL", "Presenter": "Ada QUINN", "Sex": "Female", "Presenter Affiliation": "Australian Institute for Bioengineering and Nanotechnology, University of Queensland", "Presenter Country": "Australia", "Presenter Email": "m.omara@uq.edu.au", "Presentation Requested": "Oral or poster", "Employment": "Post-doc", "Abstract": "Neurotransmitter transporters such as Glycine transporter 2 (GlyT2) are important pharmaceutical targets that are exquisitely sensitive to membrane cholesterol. Membrane cholesterol binds to GlyT2 at the membrane-embedded CHOL1 site, modulating conformational cycling, substrate uptake, and the affinity of analgesic allosteric inhibitors. Buildup of oxidized cholesterol species is a hallmark of neurodegenerative disease, altering membrane biophysical properties. Using coarse-grained molecular dynamics, we investigate how membrane oxysterol content perturbs allosteric cholesterol binding to GlyT2. We find oxysterols profoundly alter GlyT2/lipid interactions in an oxidation-site-specific manner. Oxysterols are strongly enriched in the GlyT2 lipid annulus, displacing cholesterol and polyunsaturated lipids. Furthermore, tail-oxidized cholesterol directly outcompetes cholesterol at the CHOL1 site through exceptionally stable bidentate binding, which impairs cholesterol-sensitive GlyT2 inhibitors. Our findings reveal how oxysterol accumulation may dysregulate transporter function and alter therapeutic responses in disease-altered neuronal membranes.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "COMPARISON OF LIPID DROPLET BINDING PROPERTIES OF TWO EXCHANGABLE PERILIPINS, PERILIPIN 3 AND PERILIPIN 4", "Presenter": "Alenka ČOPIČ", "Sex": "Female", "Presenter Affiliation": "Centre de Recherche en Biologie Cellulaire de Montpellier-CRBM, Université de Montpellier, CNRS", "Presenter Country": "France", "Presenter Email": "alenka.copic@crbm.cnrs.fr", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Lipid droplets (LDs) are organelles dedicated to lipid storage, composed of a neutral lipid core surrounded by a phospholipid monolayer with embedded proteins. Perilipins (PLINs) are highly abundant LD-proteins, with five PLINs present in mammals. In a cell, different PLINs often do not bind to the same population of LDs, demonstrating differences in their LD-binding properties. We aim to identify the parameters governing PLIN LD binding, focusing on PLIN4, a particularly long and repetitive PLIN. Our previous work identified different sensitivities for lipid packing defects on the LD surface for different PLINs, with PLIN4 and PLIN3 displaying similar behavior. However, PLIN4 lacks the canonical N-terminal PAT domain present in other PLINs and features an extremely long central amphipathic helix region, making its similar behavior to the more canonical PLIN3 intriguing. We investigated the contribution of the different domains of PLIN4 and PLIN3 to their LD-targeting. To this end, we expressed full-length and truncated forms of both proteins in human cell lines to explore their LD-binding behavior. While the central amphipathic region of PLIN4 most strongly affects its LD-binding properties, its non-canonical N-terminal domain also contributes to LD binding. Using in vitro approaches and molecular dynamics simulations, we also identified differences in the 4-helix bundle forming C-terminal regions of PLIN4 and PLIN3.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ambrosetti"}, {"Title": "CONFORMATIONAL NANO-SWITCH FOR FUNCTIONAL MULTIPLEXING BY CELL-SIGNALING RECEPTORS", "Presenter": "Raju REGMI", "Sex": "Male", "Presenter Affiliation": "Curie Institute, PSL University, Sorbonne University, CNRS UMR168", "Presenter Country": "France", "Presenter Email": "raju.regmi@curie.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "A central challenge in biology is determining how some receptors generate multiple, and sometimes even opposite, signals in cells. Here, we investigate the origin of multi-signaling features prevalent in life sciences with a focus on nanoscale conformational switches triggered by Fas receptor-ligand interactions. The prototypical multiplexing receptor, Fas (also known as CD95), drives both pro-life and pro-death signaling pathways; the molecular mechanisms of which remain unknown. Through an interdisciplinary approach combining genetic code expansion technology for click chemistry on mammalian receptors and single-molecule fluorescence resonance energy transfer (smFRET) spectroscopy, we observe ligand-induced conformational rearrangement of the Fas death domain, potentially serving as a switch for selective recruitment of cytosolic signaling complexes.", "Deadline": "Round 1", "Decision": "Oral", "Session": "van der Goot"}, {"Title": "CONSTANT-pH MOLECULAR DYNAMICS OF BIOLOGICAL LIPIDS", "Presenter": "Paolo ROSSETTI", "Sex": "Male", "Presenter Affiliation": "Computational Biology, Department of Biology, Friedrich-Alexander-Universität Erlangen-Nürnberg", "Presenter Country": "Germany", "Presenter Email": "paolo.rossetti@fau.de", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Negatively charged phospholipids are ubiquitous membrane components playing important roles in signaling pathways, by regulating cell apoptosis, cell replication, immune evasion in cancer cells, and stress responses in plants. Importantly, lipid protonation is sensitive to different electrostatic stimuli (i.e., pH, ion concentration, membrane environment, interactions with proteins or other biomolecules), allowing the membrane to be a highly electrostatically responsive element. Unfortunately, less is known about the molecular forces that drive protonation dynamics of titratable lipids in biological membranes and how it affects membrane characteristics. Using microsecond-long atomistic constant-pH molecular dynamics (CpHMD) simulations, we investigate titratable membrane lipids typical of eukaryotic membranes (e.g., phosphatidylserine, phosphatidic acid, phosphatidylinositols, and pyrophosphate lipids) to elucidate how their protonation dynamics are influenced by the local electrostatic environment and, in turn, how their protonation states shape membrane properties. In our previous work involving synthetic aminolipids, we showed that CpHMD accurately reproduces experimentally observed pKa shifts of 3–4 units, influenced by charge repulsion, different concentrations of cholesterol, and hydrogen bonding interactions with neighboring lipids. Here, we demonstrate that CpHMD quantitatively reproduces experimental apparent pKa values for biologically relevant lipid mixtures, providing a realistic description of the pH-dependent behavior of biological membranes.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "CONSTRUCTION OF A REALISTIC RED-BLOOD-CELL COMPUTATIONAL MODEL AT THE MOLECULAR LEVEL", "Presenter": "Hanene Samia AMEUR", "Sex": "Female", "Presenter Affiliation": "Laboratoire de Biochimie Théorique, CNRS UMR8266, Université Paris Cité", "Presenter Country": "France", "Presenter Email": "ameur@ibpc.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Biological membranes have been studied using computational models that span different spatial and temporal scales. Continuum models capture large-scale membrane behavior using effective physical properties. At a finer level of resolution, atomistic molecular dynamics represents individual atoms and their interactions within the membrane. However, this level of detail limits simulations to smaller systems and shorter timescales. Between these two levels of description, coarse-grained models reduce molecular detail while retaining important membrane properties. In this study, we used the coarse-grained membrane model developed by Fu et al. Each membrane particle represents a collection of lipids with a characteristic length scale of approximately 5 nm. The membrane particles are not connected by permanent bonds. Instead, they interact through a pair potential that depends on both the distance and relative orientation. To represent a red blood cell, we combined this membrane model with a coarse-grained cytoskeleton and explicit internal and external water. The cytoskeleton includes junction complexes, spectrin tetramers, and ankyrin particles. Spectrin tetramers are represented as chains of consecutively bonded beads. Harmonic bonds hold the cytoskeleton network together and connect it to the membrane. Water particles interact through Lennard-Jones potentials. Our goal is to build a red blood cell with a realistic diameter of about 7 µm and to reproduce its characteristic biconcave shape.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "CROWDING-CONTROLLED STREPTAVIDIN MOBILITY AND HYALURONAN BRUSH DIFFUSION ON SUPPORTED MEMBRANES", "Presenter": "Wanchung CHIANG", "Sex": "Male", "Presenter Affiliation": "Université Grenoble Alpes (UGA) – CNRS, LIPhy", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Cell adhesion is mediated by soft cell-surface coatings such as the glycocalyx, a hydrated polysaccharide brush-like structure. It is thus modulated by softness, but also lateral mobility of the binding partners and multivalent ligand-receptor interactions. To quantitatively study the contribution of these parameters to adhesion strength, we use a minimal membrane platform in which molecular density, mobility, and brush conformation can be varied independently. The platform consists of biotinylated supported lipid bilayers (SLBs), streptavidin (SAv) linkers, and biotinylated hyaluronan (b-HA) brushes. Using a combination of spectroscopic ellipsometry, confocal microscopy, and fluorescence recovery after photobleaching (FRAP), we first monitored streptavidin adsorption on biotinylated SLBs and lateral mobility of the resulting surface. We showed that by changing the incubation dose, SAv surface density could be tuned from dilute, mobile conditions to densely packed, for which crowding markedly slows down both adsorption and diffusion, suggesting that both processes are limited by the availability of free surface area. We then grafted b-HA chains onto the SAv layer and monitored the thickness (and the related grafting density) using reflection interference contrast microscopy (RICM). FRAP measurements show that b-HA grafting further reduces the diffusion coefficient of HA chains, with an amplitude that depends on b-HA density and chain interactions. These measurements provide practical conditions to tune both the conformation of model HA brush (thickness, density, and hence mechanical properties) and diffusion of chains within the brush.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "DECODING THE LIPID-PROTEIN INTERFACE OF MEMBRANE TRANSPORTERS: FROM ALLOSTERIC DYNAMICS TO STRUCTURAL PHARMACOLOGY", "Presenter": "Florent DI MEO", "Sex": "Male", "Presenter Affiliation": "Inserm U1248 Pharmacology & Transplantation, Univ. Limoges", "Presenter Country": "France", "Presenter Email": "florent.di-meo@inserm.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Legumes can establish beneficial symbiotic associations with rhizobial bacteria to acquire nitrogen, which is crucial for plant growth. This interaction leads to the formation of root nodules, specialized organs where bacteria fix atmospheric nitrogen for the host plant. Successful nodule development requires coordinated nodule organogenesis, driven by sequential reactivation of root cell divisions, and rhizobia entry towards the developing nodule, guided in most legumes by polarized infection threads. These processes rely on dynamic cellular polarization events, but the underlying molecular mechanisms are only beginning to emerge. Recent transcriptomic studies in the model legume Medicago truncatula identified two rhizobia-induced paralog genes encoding SOSEKI (SOK) plant cell polarity proteins, studied to date only in plant development. Here we show that these genes display tissue-specific expression patterns during rhizobial infection and nodule development. RNA interference and dominant-negative functional approaches in M. truncatula revealed that both SOKs are required for proper polarized infection and nodule development. Live-cell imaging studies in Nicotiana benthamiana and M. truncatula further uncovered dynamic, cell-specific SOK polarization patterns in rhizobia-infected and dividing root cells, with both intertwined and specialized subcellular localizations.", "Deadline": "Round 1", "Decision": "Oral", "Session": "van der Goot"}, {"Title": "DECODING THE ROLES OF RHIZOBIA-INDUCED SOSEKI FAMILY MEMBERS IN CELL POLARITY PROCESSES DURING LEGUME ROOT SYMBIOSIS", "Presenter": "Natasha HORTA ARAÚJO", "Sex": "Female", "Presenter Affiliation": "Laboratory of Plant-Microbe-Environment Interactions (LIPME), Toulouse University, CNRS, INRAE", "Presenter Country": "France", "Presenter Email": "natasha.horta-araujo@inrae.fr", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Membrane transporters, including the ATP-Binding Cassette (ABC) and Solute Carrier superfamilies, are critical gatekeepers governing cellular homeostasis, local pharmacokinetics, and physiological states. While structural biology has made available a myriad of static structures, understanding their structural pharmacology requires investigating their dynamic behavior within a realistic lipid bilayer membrane. We here leverage multi-microsecond all-atom molecular dynamics simulations to decipher the complex interplay between membrane, conformational plasticity, and structural dynamics across several membrane transporters, namely ABCB4, MRP1, and OAT1. Our computational insights revealed that the surrounding lipid bilayer membrane does not act as a passive container but rather specific lipid-mediated allosteric communications modulate the signal transduction between substrate binding pockets and functional domains (e.g., ABC nucleotide binding domains or SLC charge-relay system). We also bridge these fundamental biophysical mechanisms to translational approaches. For instance, we investigated the impact of single mutations on the structural dynamics of defective intracellularly-retained class II ABCB4 variants. Furthermore, we also scale these transporter functions into a biomimetic proximal tubule-on-chip model to evaluate the transcellular transporter-mediated transport of xenobiotics. Together, our multi-scale approach enables an understanding of local PK at the molecular and cellular level.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "DEVELOPMENT OF BIOMATERIAL LOADED WITH ANTIMICROBIAL PEPTIDES FOR THE TREATMENT OF ORTHOPAEDIC INFECTIONS", "Presenter": "Jean-Daniel MALCOR", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Biologie Tissulaire et Ingénierie Thérapeutique (LBTI), CNRS, Lyon, France", "Presenter Country": "France", "Presenter Email": "jean-daniel.malcor@ibcp.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Periprosthetic joint infections (PJIs) are among the most common implant-associated infections, affecting approximately 1-2% of joint replacement patients. These infections can compromise implant success and delay patient recovery. Among the pathogens responsible for these infections, Staphylococcus aureus (S. aureus) is one of the most common causes of PJIs. It remains one of the most challenging microorganisms due to its ability to adhere to implant surfaces, form biofilms, and persist despite antibiotic therapy. Biofilm formation provides a protective barrier that helps bacteria resist antimicrobial agents. With the increasing threat of antimicrobial resistance, there is an urgent need for antibiotic alternatives. Some antimicrobial peptides (AMPs) are promising candidates due to their antibacterial activity and anti-biofilm activities. Here, GH12, a promising cationic antimicrobial peptide, is used to evaluate its antibacterial and anti-biofilm properties against S. aureus. Furthermore, the integration of promising AMPs into biocompatible biomaterials, such as fibrin-based hydrogel, a natural polymer, may provide a strategy for localized and sustained antimicrobial activity while supporting tissue repair.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "DURABIN: MULTISCALE MODELING OF BIOLOGICAL MEMBRANES", "Presenter": "Stéphanie BAUD", "Sex": "Female", "Presenter Affiliation": "Université de Reims Champagne Ardenne, UMR CNRS/URCA 7369", "Presenter Country": "France", "Presenter Email": "stephanie.baud@univ-reims.fr", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Many essential biological processes, such as protein folding and membrane remodeling, are inherently multiscale, going from atomic-level interactions to mesoscopic structures. Structural biology techniques and molecular dynamics simulations allow studying systems at the atomic resolution, but the mesoscopic scale is more difficult to explore. In order to tackle this problem, multiscale computational methodologies have been developed, where data obtained from quantum mechanics (QM) calculations and all-atom molecular dynamics (AA-MD) are used to parametrize and fine-tune coarser models such as coarse-grained molecular dynamics (CG-MD) or Brownian dynamics (BD). DURABIN is a framework developed over the past decade that integrates multiscale modeling with real-time visualization using the UNITY game engine. It enables users to construct, simulate, and explore systems with very little computational expertise. The simulations are done at the ultra-coarse-grain level, and proteins are modeled as chains of rigid bodies connected by joints. The interactions between proteins and the membrane are modeled using the IMPALA force field, while the interactions between proteins are modeled through colliders and a potential derived from all-atom molecular dynamics simulations.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "EXPLORING AMYLOID-β INTERACTIONS WITH MULTICOMPONENT NEURONAL MEMBRANES", "Presenter": "Sahire Azam ANSARY", "Sex": "Female", "Presenter Affiliation": "MIFT, University of Messina", "Presenter Country": "Italy", "Presenter Email": "sahire_azam.ansary@chem.lu.se", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "The aggregation of amyloid-β (Aβ) peptides and their interactions with neuronal membranes are central to the pathology of Alzheimer’s disease. Although the two predominant isoforms, Aβ₄₀ and Aβ₄₂, are known to associate with lipid bilayers, their molecular behavior in compositionally complex neuronal membranes remains incompletely understood. Here, we use all-atom molecular dynamics simulations to investigate the interactions of initially disordered Aβ₄₀ and Aβ₄₂ monomers with two membrane models of increasing complexity: a ternary POPC/SM/CHOL (2:1:1) bilayer and a five-component neuronal membrane containing POPC, DPPC, SM, CHOL, and GM1. We characterize peptide conformations, residue-specific peptide–lipid interactions, lipid-contact patterns, lipid preferences, and selected structural properties of the membranes. By systematically comparing the two peptide isoforms across these membrane environments, this study explores the relationship between membrane composition, peptide conformational behavior, and peptide–lipid association.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "EXTENSION OF THE MULTI-EGO STRUCTURE-BASED FORCE FIELD TO LIPID MEMBRANES", "Presenter": "Laura AIRAGHI", "Sex": "Female", "Presenter Affiliation": "Università degli Studi di Milano, Department of Biosciences", "Presenter Country": "Italy", "Presenter Email": "laura.airaghi@unimi.it", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Membranes are fundamental structures of living systems, and despite an apparent simple composition, they still represent a major challenge for state-of-the-art modeling. Membrane internal dynamics and the large size of realistic membranes hamper the possibility of a \"computational microscope\" in the context of molecular dynamics simulations at atomic resolution. One of the most promising innovations to fill the size and time gaps in modeling is represented by the development of accurate coarse-grained (CG) models, which have recently enabled the simulations of larger membrane systems over longer timescales. In the context of simplified models, we developed multi-eGO, a structure-based/data-driven model that combines atomistic resolution with enhanced computational efficiency by representing only the heavy atoms and implicitly treating the solvent. Following a Bayesian approach, we update a transferable prior with system-specific information learned from training MD simulations. Bonded interactions are transferable, while non-bonded interactions are derived from structural data and described using the Lennard-Jones potential. Here, we extend multi-eGO to lipid systems to describe membrane structure and dynamics. Representative lipid bilayers were simulated using all-atom MD to generate reference and training data.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "FIRST EVER Eu3+ COMPLEX AS MEMBRANE PROBE", "Presenter": "Léo CORNE", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Chimie, ENS de Lyon", "Presenter Country": "France", "Presenter Email": "leo.corne@ens-lyon.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Lanthanide complexes exhibit unique luminescent properties: long emission lifetimes (ms), intense and narrow characteristic emission bands (which enable the study of the environment), as well as tunable absorption characteristics. The Eu³⁺ mTAT[Eu·L-Ar-Cz] complex, which contains an (N-carbazolyl)-aryl-picolinamide antenna, is conjugated to a polycationic TAT peptide capable of penetrating cells. The quantum yield of Eu³⁺ emission in this complex is highly dependent on solvent polarity, ranging from 0.13 in DMF to 0.0017 in PBS. Nevertheless, this complex exhibited intense emission when incubated with cells, particularly in lipid-rich regions. The interactions between the complex and the membrane were examined using epifluorescence microscopy and Giant Unilamellar Vesicles (GUVs) prepared from a DOPC/DOPG (90/10) mixture, revealing that the complex was colocalized at the membrane surface. A spectroscopic and small-angle neutron scattering study, carried out using liposomes of the same composition, showed that the complex is distributed across the surface of the membrane and that the antenna penetrates the membrane, thereby altering its local polarity and emission characteristics.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "FROM LIPID MEMBRANES TO LIPID NANOPARTICLE DESIGN WITH MARTINI 3 MODEL", "Presenter": "Paulo C. T. SOUZA", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Biologie et Modélisation de la Cellule, CNRS, UMR 5239, Inserm, U1293, Université Claude Bernard Lyon 1, Ecole Normale Supérieure de Lyon", "Presenter Country": "France", "Presenter Email": "paulo.telles_de_souza@ens-lyon.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Lipid assemblies exhibit complex phase behavior that governs organization, remodeling, fusion, and molecular transport. Understanding these collective phenomena is essential for deciphering lipid-mediated biological processes and designing lipid-based delivery systems. Experimental approaches often lack the resolution needed to reveal the underlying molecular mechanisms, while atomistic molecular dynamics simulations remain computationally demanding. Coarse-grained (CG) molecular dynamics simulations, particularly with the Martini force field, provide an attractive alternative. In this talk, I will present recent advances in the Martini 3 lipid models that improve membrane properties and phase behavior. Building on refined lipid-tail parameters and an expanded lipid library, these developments reproduce phase transitions while capturing lipid domain formation, ion-mediated phase separation, and non-lamellar phases. These advances naturally extend to lipid nanoparticles (LNPs), enabling mechanistic studies of nucleic acid encapsulation, pH-dependent structural transitions, membrane fusion, and endosomal escape.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "FROM MEMBRANE DISRUPTION TO RECEPTOR ACTIVATION - MECHANISTIC INSIGHTS INTO PSMα3 CYTOTOXICITY", "Presenter": "Laura BONNECAZE", "Sex": "Female", "Presenter Affiliation": "Univ. Bordeaux, CNRS, Bordeaux INP, CBMN, UMR5248", "Presenter Country": "France", "Presenter Email": "laura.bonnecaze@u-bordeaux.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "The virulence of Staphylococcus aureus, a multi-drug-resistant pathogen, is tightly linked to the secretion of phenol-soluble modulins (PSMs), notably PSMα3, which self-assembles into unique cross-α amyloid-like fibrils. Here, we investigate the molecular mechanisms underlying the concentration-dependent cytotoxic activities of PSMα3. At micromolar concentrations, PSMα3 directly interacts with lipid membranes, leading to membrane disruption and cell lysis. Combining atomic force microscopy, infrared spectroscopy, and nuclear magnetic resonance, we identified intermediate species as the primary cytotoxic entities and demonstrated that membrane lipid composition modulates their activity. Notably, PSMα3-induced depletion is enhanced by membrane rigidity via cholesterol content or phase separation. At nanomolar concentrations, PSMα3 activates the G-protein-coupled receptor FPR2, triggering pro-inflammatory signaling and neutrophil recruitment. Using Förster resonance energy transfer and confocal microscopy, we demonstrate that FPR2 activation involves the Gαi signaling pathway and results in inhibition of cAMP production.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ambrosetti"}, {"Title": "FROM MEMBRANE PERTURBATION TO BIOFILM ARCHITECTURE - IMPACT OF PSMΑ3 ON STAPHYLOCOCCUS EPIDERMIDIS", "Presenter": "Chloé BOURA", "Sex": "Female", "Presenter Affiliation": "Univ. Bordeaux, CNRS, Bordeaux INP, CBMN, UMR5248", "Presenter Country": "France", "Presenter Email": "chloe.boura@u-bordeaux.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Polymicrobial biofilms formed by Staphylococcus aureus and Staphylococcus epidermidisare a major clinical challenge due to their antibiotic resistance. Within these communities, bacteria secrete virulence factors, such as phenol-soluble modulins (PSMs), which play key roles in biofilm regulation and eventually in niche competition. Here, we investigate the impact of PSMα3 from S. aureus on the competing bacterium S. epidermidis, using a multiscale in vitro and in cellulo approach, combining calcein leakage assays, viability tests, atomic force microscopy, and confocal imaging. At the cellular scale, our results reveal that PSMα3 leads to a 3-fold decrease in bacteria elasticity without a major loss of viability, suggesting sublethal effects. Besides, on simplified models (in the absence of cell wall components), PSMα3 induces concentration- and lipid-dependent membrane perturbations. Importantly, at the community level, microbiological analyses suggest that PSMα3 could promote dispersion of bacterial aggregates rather than a direct bactericidal effect. This hypothesis is further supported by biofilm imaging, indicating that PSMα3 might alter biofilm integrity through modulation of its thickness and density. Overall, by integrating biophysical tools across scales, from molecular interactions to bacterial ensemble dynamics, we highlight subtle effects of PSMα3 from S. aureus on S. epidermidis, that may influence microbial competition.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "HIGH AFFINITY ARTIFICIAL BINDERS FOR INTEGRATED CHARACTERIZATION OF AN ESSENTIAL MALARIA PROTEIN", "Presenter": "Thibaud DIEUDONNE", "Sex": "Male", "Presenter Affiliation": "Université Paris-Saclay, CEA, CNRS, Institute for Integrative Biology of the Cell (I2BC)", "Presenter Country": "France", "Presenter Email": "thibaud.dieudonne@i2bc.paris-saclay.fr", "Presentation Requested": "Oral or poster", "Employment": "Post-doc", "Abstract": "Despite major progress in malaria control, the disease remains a significant global health challenge driven by the emergence of multidrug resistance among parasite species. Addressing this challenge requires the need to identify and characterize essential parasite proteins with therapeutic potential. One promising target is the Plasmodium falciparum Ca²⁺-ATPase 6 (PfATP6), an essential and unique calcium P-type ATPase. The aim of this study is to develop molecular tools to investigate the structure, function, and endogenous localization of PfATP6 to improve its potential as an antimalarial target. Here we present a procedure to immobilize purified PfATP6 solubilized in detergent on ELISA plates and screen a diverse library of artificial proteins (alphareps) by phage display. Iterative rounds of affinity selection led to the identification of two highly specific alpharep variants binding PfATP6 with nanomolar affinities. BLI experiments show that the interaction is independent of PfATP6 conformation, with both alphareps showing comparable nanomolar affinities across different PfATP6 calcium transport cycles. Additionally, alphareps binding did not interfere with the ATPase activity of PfATP6, supporting their use as suitable structural and functional tools. Lately, preliminary cryo-EM data revealed that both alphareps bind the same specific cytoplasmic domain of PfATP6, in agreement with AlphaFold predictions.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "HIGH-RESOLUTION CRYO-EM STRUCTURES OF VDAC2-BAX/BAK COMPLEXES TO ELUCIDATE MITOCHONDRIAL APOPTOSIS MECHANISMS", "Presenter": "Agathe HUBERT", "Sex": "Female", "Presenter Affiliation": "CNRS - LISM, UMR7255", "Presenter Country": "France", "Presenter Email": "lbergdoll@imm.cnrs.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Apoptosis is a tightly regulated form of programmed cell death that plays a fundamental role in development and tissue homeostasis. In the intrinsic apoptotic pathway, cellular stress signals trigger the activation of the pro-apoptotic proteins BAX and BAK. These proteins translocate to the mitochondrial outer membrane, where they oligomerize to form pores that enable the release of cytochrome c, initiating the caspase cascade and ultimately leading to cell death. However, the molecular mechanism governing the recruitment and insertion of BAX and BAK into the mitochondrial outer membrane remains poorly understood. The Voltage-Dependent Anion Channel protein VDAC2, located in the mitochondrial outer membrane, has been proposed to play a key role in this process. Previous electrophysiological studies and co-purification experiments suggest a direct interaction between VDAC2 and BAX. In our study, VDAC2 is produced in nanodiscs, and the VDAC2-BAX complex is generated using a cell-free expression system. Following purification through the His-tag on VDAC2, immunoblot analysis confirms the presence of both VDAC2 and BAX. Cross-linking experiments further support the formation of a stable complex between these proteins. Preliminary cryo-electron microscopy analyses are currently underway to visualize this complex at high resolution. Our objective is to characterize the structural basis of the VDAC2-BAX interaction to elucidate the molecular mechanism regulating mitochondrial membrane permeabilization during apoptosis.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "HOW AN ABC TRANSPORTER – TWO-COMPONENT SYSTEM MEDIATES ANTIMICROBIAL PEPTIDE RESISTANCE IN STREPTOCOCCUS PNEUMONIAE", "Presenter": "Marine NOVELLI", "Sex": "Female", "Presenter Affiliation": "Molecular Microbiology and Structural Biochemistry (MMSB), UMR 5086 CNRS/University of Lyon", "Presenter Country": "France", "Presenter Email": "cedric.orelle@ibcp.fr", "Presentation Requested": "Poster", "Employment": "Post-doc", "Abstract": "Antimicrobial peptides (AMPs), produced by most living organisms, are promising antibacterial compounds and constitute a key component of innate immunity. Most AMPs act by disrupting the bacterial membrane or by inhibiting peptidoglycan biosynthesis, an essential process for bacterial cell wall integrity. In S. pneumoniae, a pathogen responsible for severe respiratory infections, resistance to AMPs is mediated by the BceAB/TCS01 signaling system, which couples an ABC transporter to a two-component regulatory system. AMP sensing by BceAB activates a phosphorylation cascade, resulting in the induction of bceAB expression and enhanced resistance to peptidoglycan-targeting AMPs. Also, TCS01 has been identified as a major virulence determinant in S. pneumoniae. Despite its importance, the molecular mechanism underlying BceAB/TCS01 function remains poorly understood. This project aims to elucidate the molecular basis of BceAB/TCS01-mediated AMP resistance and improve our understanding of host–pathogen interactions.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "HOW DOES THE SATURATION OF LIPIDS INFLUENCE THE ALIGNMENT OF MEMBRANE PEPTIDES?", "Presenter": "Andreas RUMPEL", "Sex": "Male", "Presenter Affiliation": "Chemistry Institute UMR7177, University of Strasbourg/CNRS", "Presenter Country": "France", "Presenter Email": "andreas.rumpel@etu.unistra.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Two well-known antimicrobial peptides (AMPs) are magainin and PGLa, enhancing their bioactivity when combined, referred to as synergism, which is most effective at a 1:1 molar ratio. Further studies show that the alignment of the peptides on the surface of cell membranes depends on the saturation of the lipid fatty acid chains within the membrane. Saturated lipids push the equilibrium towards a transmembrane orientation, whereas unsaturated lipids stabilize an in-planar orientation of PGLa and the model peptide LAH4. We are investigating the effect of the peptides on the properties of saturated and non-saturated lipids. The perturbation capability of the peptides on the membrane can be characterized by the order parameter. Generally, a high order parameter corresponds to a well-ordered structure, while a low value indicates reduced order. The membrane models used in this study were composed of both pure and mixed lipids (e.g., POPE, POPG, DMPE, and DMPG). Previously, exclusively the saturated aryl chain(s) were measured by deuterium NMR. In-planar peptides show a more pronounced effect on the order parameter than transmembrane peptides. For non-saturated lipids, the energetic penalty from chain disordering for hosting in-planar peptides is probably lower than for saturated lipids.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "HOW LPS SHAPES LPTB2FG DYNAMICS IN A NATIVE-LIKE INNER MEMBRANE", "Presenter": "Dario DE VECCHIS", "Sex": "Male", "Presenter Affiliation": "Univ. Grenoble Alpes, CNRS, CEA, Institute of structural biology", "Presenter Country": "France", "Presenter Email": "dario.de-vecchis@ibs.fr", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Gram-negative bacteria rely on lipopolysaccharide (LPS) to build the outer-membrane permeability barrier that contributes to intrinsic antimicrobial resistance. The ABC transporter LptB₂FG extracts LPS from the inner membrane, but how substrate recognition shapes transporter dynamics remains unclear because most current models come from detergent or nanodisc-reconstituted systems rather than native-like membranes. Here, we use multiscale molecular dynamics simulations, combining coarse-grained and atomistic approaches, to examine how LPS modulates LptB₂FG dynamics in a native-like Gram-negative inner membrane. Our initial simulations suggest that LPS can contact the transporter through its sugar-rich headgroup before acyl-chain entry into the cavity, with extended moieties such as the O-antigen reaching beyond the transporter boundaries into the periplasm. We therefore hypothesize that distinct LPS regions influence early recognition, lipid accessibility at the transporter mouth, and local membrane organization during the first steps of extraction.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "HOW PGL FINDS A SWEET SPOT IN PHOSPHOLIPID MEMBRANES – A COMBINED MULTISCALE MD AND NMR STUDY", "Presenter": "Evert HAANAPPEL", "Sex": "Male", "Presenter Affiliation": "Université de Toulouse, Centre National de la Recherche Scientifique, Laboratoire de Microbiologie et Génétique Moléculaires (LMGM, UMR5100)", "Presenter Country": "France", "Presenter Email": "everhard.haanappel@utoulouse.fr", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "Glycolipids from pathogenic Mycobacterium tuberculosis (Mtb) play important roles during the interaction of the pathogen with macrophages and can shape the host cell’s immune response by modulating its membrane structure and function. Here we study the phenolic glycolipids (PGLs) present in the envelope of some hypervirulent strains of Mtb, and their impact on model membranes. By a combination of molecular modeling and simulations, and solid-state NMR experiments, we show that PGLs, like the structurally related lipid PDIM, adopt a conical shape in lipid membranes, which destabilizes the lamellar membrane phase and promotes a transition to a non-lamellar inverted-hexagonal phase. Unlike PDIM, in our simulations, PGLs remain anchored to the phosphate groups of the lipid bilayer by their sugar-carrying extremity, preventing lipid flip-flop. These findings shed new light on a potential biophysical role of PGLs through modulation of the properties of the host cell’s membrane, in addition to the recognition of its sugar moiety by host cell immune receptors.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "IDENTIFYING THE MOLECULAR BASIS OF THE AUTOINHIBITION RELIEF MECHANISM OF THE DISEASE-RELATED LIPID FLIPPASE ATP8B1", "Presenter": "Thibaud DIEUDONNE", "Sex": "Male", "Presenter Affiliation": "Université Paris-Saclay, CEA, CNRS, Institute for Integrative Biology of the Cell (I2BC)", "Presenter Country": "France", "Presenter Email": "thibaud.dieudonne@i2bc.paris-saclay.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "P4-ATPases, also known as flippases, are eukaryotic membrane proteins capable of transporting phospholipids from the exoplasmic to the cytosolic leaflet of membranes using energy from ATP hydrolysis. This lipid transfer is crucial to create and maintain membrane lipid asymmetry, which is essential for cellular processes such as membrane trafficking, signal transduction, and resistance to mechanical and chemical stress. The human genome encodes 14 P4-ATPases, which form heterodimers with a CDC50 chaperone protein. Their physiological significance is underscored by the fact that approximately half of them have been linked to critical diseases. In particular, inactivating mutations in th

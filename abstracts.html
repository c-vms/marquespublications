amounts of stable SilP for structural studies. Cryo-EM analysis produced well-defined 2D class averages and a preliminary 3D reconstruction, demonstrating the suitability of the sample for structural characterization. These results establish a robust purification strategy for SilP and provide the foundation for future high-resolution structural and functional studies of this putative silver transporter.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "SIMULATING COMPOSITION CHANGES IN BIOLOGICAL MEMBRANES WITH POP-MD", "Presenter": "Sonia CAMBIASO", "Sex": "Female", "Presenter Affiliation": "Molecular Microbiology and Structural Biochemistry, UMR 5086 CNRS & Université de Lyon 1", "Presenter Country": "France", "Presenter Email": "luca.monticelli@inserm.fr", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "The majority of molecular dynamics (MD) simulations of biological systems are performed under thermodynamic equilibrium, whereas life is inherently a non-equilibrium phenomenon. Many biological processes occur on timescales far beyond the reach of current MD simulations, which are typically limited to the microsecond-to-millisecond range. To investigate how biological membranes respond to dynamical changes in composition, we introduce POP-MD, a simulation protocol that enables continuous modification of the number and identity of particles within user-defined regions of an MD simulation. By adding, removing, or transforming molecules during a simulation, POP-MD allows probing, on nanosecond to microsecond timescales, the response of membrane systems to changes in molecular composition that experimentally take place in milliseconds to seconds. As an example, POP-MD reveals that asymmetric phospholipid synthesis is necessary to drive lipid droplet budding, bypassing the rate-limiting metabolic reactions responsible for lipid synthesis. We further demonstrate its versatility by dynamically constructing starting configurations, emulating lipid flip-flop, accelerating lipid mixing and demixing, and simulating vesicle growth by asymmetric phospholipid synthesis. Although POP-MD is not a rigorous framework for non-equilibrium dynamics, the vastly accelerated kinetics enables the simulation of processes that remain inaccessible to conventional MD and provides a practical framework for investigating composition-driven biological phenomena at molecular resolution, paving the way to simulations of organelle biogenesis.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "SOLVING THE LIGAND-CHANNEL PUZZLE: AN INTEGRATED STRUCTURE-FUNCTION-BINDING PIPELINE", "Presenter": "Christophe MOREAU", "Sex": "Male", "Presenter Affiliation": "Institut de Biologie Structurale", "Presenter Country": "France", "Presenter Email": "christophe.moreau@ibs.fr", "Presentation Requested": "Poster", "Employment": "Post-doc", "Abstract": "Ion channels are major transmembrane therapeutic and agricultural targets that translate extracellular chemical signals into detectable electrical currents. Deciphering the molecular mechanisms of their regulation by ligands remains a technical challenge. No single technique is generally sufficient, and it requires a coordinated workflow to bridge the gap between static structures and dynamic functions. Here, we present a combination of interdisciplinary techniques that are complementary. As a structural assay, we use the cryo-EM technique, which provides high-resolution structural snapshots but lacks functional context. To address this issue, we combine functional analysis with the Two-Electrode Voltage Clamp (TEVC) electrophysiological technique with rational site-directed mutagenesis. As a binding assay, we use MicroScale Thermophoresis (MST) to quantify the biophysical features of ligand-protein interactions. This workflow helps us to decipher key protein-peptide complexes involved in Alzheimer’s disease and to uncover new regulatory molecules of insect olfactory receptors for health and crop protection by transforming each individual technical constraint into a solved puzzle.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "SPHINGOLIPIDS DRIVE SURFACTIN-INDUCED PLANT IMMUNITY THROUGH MEMBRANE REMODELLING", "Presenter": "Guillaume GILLIARD", "Sex": "Male", "Presenter Affiliation": "University of Picardie Jules Verne, unité de génie enzymatique et cellulaire (GEC)", "Presenter Country": "France", "Presenter Email": "guillaume.gilliard@u-picardie.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "Plant-associated beneficial rhizobacteria are able to stimulate and enhance plant immunity through the secretion of metabolites, such as cyclic lipopeptides (CLPs). While the plant disease reduction due to CLPs is well-documented, their sensing mechanisms at the plant cell surface remain largely unresolved. Combining biological and biophysical approaches, we demonstrated that the immune activation in Arabidopsis thaliana is mediated by a specific interaction with membrane sphingolipids, leading to changes in membrane mechanical properties and structure. These physical changes are then perceived by mechanosensitive channels, which activate ion fluxes and initiate early immune signaling. This mechanism results in systemic defense potentiation and enhanced resistance to the necrotrophic fungus Botrytis cinerea. Our findings uncover a lipid-mediated sensing mechanism for bacterial CLPs by plant cells that is distinct from the classical description of plant immunity, relying on protein pattern recognition receptors to initiate pattern-triggered immunity. Beyond its fundamental significance, understanding the chemical dialogue between rhizobacteria and host plants is a promising alternative to chemical crop protection strategies.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Caillaud"}, {"Title": "STRUCTURAL AND DYNAMICS OF APOA-1 MIMETIC PEPTIDE LIPID NANODISC ASSEMBLIES: A MOLECULAR DYNAMICS STUDY", "Presenter": "Rohith RAVI", "Sex": "Male", "Presenter Affiliation": "Université Marie & Louis Pasteur", "Presenter Country": "France", "Presenter Email": "gabin.fabre@unilim.fr", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Apolipoprotein A-I (apoA-I) mimetic peptides, inspired by the principal protein component of high-density lipoprotein, are known to self-assemble with lipids to form discoidal nanodiscs. These are widely used in biomedical research and as versatile scaffolds for characterization of membrane proteins in structural biology. Since there is a strong interplay between lipids and apoA-I mimetic peptides, a precise knowledge of the composition, structure, and dynamics of these complexes is needed at the molecular level. Here, we investigated the 14A apoA-I mimetic, quantifying its orientation around the lipid bilayer and identifying the interactions that are crucial for nanodisc stability and dynamics using all-atom molecular dynamics simulations. To assess model fidelity, we back-calculated solid-state NMR observables, namely ¹⁵N chemical shifts and ²H quadrupolar splittings from the trajectories, and compared them with solid-state NMR data. For DMPC lipids, simulations support a dimeric, antiparallel, belt-like arrangement of 14A peptides around the discoidal bilayer, stabilized by π–π stacking between aromatic residues and by electrostatic and hydrophobic peptide–lipid interactions. These interactions yield structurally stable nanodiscs with pronounced heterogeneity in lipid ordering and bilayer thickness between the nanodisc center and rim. Collectively, our MD results provide atomistic evidence for previously hypothesized peptide–peptide and peptide–lipid interactions and clarify how amphipathic helices organize to form the rim of discoidal nanodiscs.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "STRUCTURAL AND FUNCTIONAL CHARACTERIZATION OF THE MYCOBACTERIAL LIPOARABINOMANNAN SUCCINYLTRANSFERASE", "Presenter": "Anna BARILE", "Sex": "Female", "Presenter Affiliation": "Institut de pharmacologie et de biologie structural (IPBS)", "Presenter Country": "France", "Presenter Email": "kien-lam.ung@ipbs.fr", "Presentation Requested": "Poster", "Employment": "Post-doc", "Abstract": "Mycobacterium tuberculosis (Mtb) is a medically important pathogen and is considered a major threat worldwide. The rise of drug-resistant Mtb has intensified the need for alternative therapeutic strategies, and targeting bacterial virulence factors has emerged as a promising approach to combat antimicrobial resistance. Mycobacteria possess an unusual, lipid- and glycolipid-rich cell envelope that plays a central role in its pathogenicity, intrinsic drug resistance, and ability to evade host immune responses. This envelope is highly dynamic and can covalently modify its glycolipids to adapt to environmental stresses. Lipoarabinomannan (LAM), a major glycoconjugate of the mycobacterial cell envelope, is a key virulence factor and immunomodulator essential for M. tuberculosis pathogenesis. Covalent modification of LAM by succinylation is known to regulate the mannose-capping, an essential process that pathogens use to evade the immune response of the host. Moreover, SucT is the sole enzyme that catalyzes this reaction. If this protein is absent, the progressive branching of LAM is disrupted, and alterations of cell envelope biogenesis occur. SucT is a key enzyme involved in the transmembrane succinylation of LAM. The molecular mechanisms underlying the translocation of succinyl groups remain largely unknown. Our team aims to decipher these mechanisms through a complementary multidisciplinary approach combining microbiology, enzymology, biophysics, and structural biology (cryo-EM) to obtain a detailed snapshot of the enzyme in action.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "STRUCTURAL AND THERMOTROPIC EFFECTS OF LIPID HYDROPEROXIDATION IN LIPID BILAYERS", "Presenter": "Sifre VAN TEEFFELEN", "Sex": "Male", "Presenter Affiliation": "University of Lyon, ENS Lyon, CNRS UMR 5182, Chemistry Laboratory", "Presenter Country": "France", "Presenter Email": "sifre.van_teeffelen@ens-lyon.fr", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "Lipid peroxidation is a defining feature of oxidative stress and a major factor in membrane dysfunction during aging, inflammation, and disease. While oxidation-induced changes in bilayer structure are well recognized, their impact on the main phase transition and membrane organization of phospholipids remains poorly understood. Here, we investigate how hydroperoxidation affects the phase behavior and structural properties of two phosphatidylcholine lipids, 1-stearoyl-2-oleoyl-sn-glycero-3-phosphocholine (SOPC) and 1-stearoyl-2-petroselinoyl-sn-glycero-3-phosphocholine (SPPC), together with their hydroperoxidized forms. Mixtures of oxidized and non-oxidized lipids were characterized using complementary techniques. Differential scanning calorimetry (DSC) and steady-state fluorescence spectroscopy with the environment-sensitive probes Laurdan and A10 were used to probe phase behavior. Membrane structure and organization were further investigated using neutron scattering. Hydroperoxidation strongly alters membrane thermodynamics and nanoscale structure, revealing a complex phase-transition landscape driven by acyl-chain ordering and hydroperoxide distribution. Together, these measurements provide a multiscale view of how lipid peroxidation modulates membrane organization, offering insight into the molecular consequences of oxidative stress in biomimetic membranes.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Nadler"}, {"Title": "STRUCTURAL BASIS OF LATERAL GATE DYNAMICS AT THE BACTERIAL LIPOPOLYSACCHARIDE HOLO-TRANSLOCON", "Presenter": "Haoxiang CHEN", "Sex": "Male", "Presenter Affiliation": "Laboratoire de Microbiologie et Génétique Moléculaires (LMGM), Centre de Biologie Intégrative (CBI), Université de Toulouse, CNRS", "Presenter Country": "France", "Presenter Email": "Raffaele.ieva@utoulouse.fr", "Presentation Requested": "Oral or poster", "Employment": "Unknown", "Abstract": "Lipopolysaccharide (LPS) assembly at the surface-exposed leaflet of the bacterial outer membrane (OM) is mediated by the OM LPS translocon, comprising the essential β-barrel protein LptD and its cognate lipoprotein LptE. How this translocon selectively transports LPS to the OM surface, establishing membrane lipid asymmetry, remains unclear. We present our recent structural and functional characterization of the OM LPS holotranslocon, including the newly identified lipoproteins LptM and LptY. LptY stabilizes the periplasmic β-taco domain of LptD, which functions as an LPS receptor, whereas LptM intercalates the lateral gate of LptD β-barrel at the interface with the β-taco domain. We identify a conformational switch of this interface that alternates between contracted and extended states. During this transition, β-strand 1 of LptD binds LPS and undergoes a stroke-like movement toward the outer leaflet. Together, these findings establish a mechanistic framework for selective assembly of LPS at the surface-exposed leaflet of the OM.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "STRUCTURAL INSIGHTS INTO THE INHIBITION OF THE DRUG EFFLUX ACTIVITY OF THE HEDGEHOG RECEPTOR PATCHED1", "Presenter": "Oussama Houha", "Sex": "Male", "Presenter Affiliation": "Université Paris Cité, CNRS, Biochimie des Protéines Membranaires", "Presenter Country": "France", "Presenter Email": "valerie.biou@ibpc.fr", "Presentation Requested": "Oral or poster", "Employment": "Unknown", "Abstract": "PATCHED1 is the receptor of the HEDGEHOG morphogen and transports cholesterol in a proton motive force-dependent way. In cancer, it is responsible for chemotherapy drug efflux. Screening of a natural product bank identified panicein-A hydroquinone (PAH), a marine sponge compound, as an inhibitor of PATCHED1-mediated dxr resistance, highlighting its potential as a therapeutic target. In order to better understand the efflux inhibition activity of PAH towards PTCH1, we over-expressed and purified PATCHED1 in HEK293 cells, measured its affinity for PAH, and solved its structure in complex with PAH by cryo-EM. We identified a PAH binding site in the extracellular region and the residues involved in this binding pocket. PAH binds in the channel linking the sterol-sensing domain to the extracellular medium. It makes hydrogen bonds with the protein, either directly or via water molecules, and leaves a large cavity empty, opening the way to structure-based drug design to improve drug potency. Molecular dynamics (MD) simulations showed that PAH is stable in the binding site and also makes strong interactions. These results provide key information on the mechanism by which PAH inhibits PTCH1 efflux activity.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Ung"}, {"Title": "STRUCTURAL STUDIES OF DIPTERA AND LEPIDOPTERA PENTAMERIC RECEPTOR FOR THE DESIGN OF INSECTICIDAL PROTEINS", "Presenter": "Farah FOULADKAR", "Sex": "Female", "Presenter Affiliation": "Institut de Biologie Structural, IBS, UGA, CNRS, UMR5075", "Presenter Country": "France", "Presenter Email": "farah.fouladkar@ibs.fr", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Farmers use insecticides to protect their crops. However, these products cause environmental problems due to their lack of selectivity: while pests are killed, beneficial insects such as bees are also harmed. In our laboratory, we focus on insect pentameric ligand-gated ion channels (pLGICs). These membrane receptors consist of five subunits, each containing three distinct domains: an extracellular domain housing the neurotransmitter binding site, a transmembrane domain with four alpha helices, and a disordered intracellular domain. pLGICs play a prominent role in fast neurotransmission, with receptors sensitive to acetylcholine, GABA, or glutamate. Neuronal pLGICs also form the largest class of targets of insecticides. A mysterious, understudied subclass of insect pLGICs is found not in the nervous system but in the gut, known as clade-1 receptors. We set up to shed light on the molecular mechanism of those gut receptors and on their potential as insecticide targets. Clade-1 receptors, first identified in Drosophilaand known as HODOR, act as a sensor essential for larval growth and development. Despite their biological importance, HODOR remains poorly characterized. Three HODOR homologues are present in Drosophila, and a single homologue has been identified in mosquitoes and lepidoptera. To investigate this receptor family, we cloned several HODOR homologues from dipteran and lepidopteran species and expressed them in Sf21 insect cells. Protein expression was monitored by flow cytometry and fluorescence-detection size-exclusion chromatography (FSEC). Preliminary results obtained for the mosquito and Plutella xylostella HODOR homologues are highly encouraging. We successfully purified both receptors with high yields and good stability over a range of pH conditions. Initial cryo-electron microscopy studies have yielded a high-resolution structure for these receptors. Our next objective is the development of high-affinity binders targeting clade-1 receptors, which will subsequently be screened using a yeast display platform to identify candidates with selective insecticidal activity.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "STRUCTURAL WEAKNESSES ALLOW THE ABC TRANSPORTER TO DEFORM WITHIN THE MEMBRANE", "Presenter": "Theo BENEFICE", "Sex": "Male", "Presenter Affiliation": "Molecular Microbiology & Structural Biochemistry, CNRS-Lyon 1 University Laboratory, UMR 5086", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral or poster", "Employment": "PhD student", "Abstract": "ATP-binding cassette (ABC) transporters constitute one of the largest families of membrane proteins and play a key role in cellular detoxification, lipid trafficking, and multidrug resistance. These proteins must undergo conformational deformations to translocate substrates across the hydrophobic barrier of the lipid bilayer. Yet, at the same time, they are constrained by the membrane that exerts a lateral pressure on their structure. Structural evidence suggests that they undergo deformations using helical discontinuities in transmembrane segments acting as mechanical joints, allowing them to deform and change conformations. This observation is also seen in the conformational landscape derived from inter-particle variability of cryo-EM data, showing helical deformations stemming from these kinks. We undertook a statistical analysis of the PDB to understand how these deformations distribute compared to the membrane bilayer for the type IV family of ABC transporters. We could visualize how the kinks distribute in each transmembrane helix, as well as their degree of deformation. We also investigated the distribution of kinks in different conformations sampled by these ABC transporters (from inward-to outward-facing). Altogether, this analysis brings a statistical view of how a whole family of transporters uses fragility within their framework to perform conformational changes.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "TARGETING MEMBRANE STEROL HOMEOSTASIS WITH AZOLES TO INHIBIT PATHOGENIC YEASTS", "Presenter": "Rim BACCOUCH", "Sex": "Female", "Presenter Affiliation": "Drug Resistance & Membrane Proteins group, MMSB, UMR CNRS-UCBL1 5086", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral or poster", "Employment": "Post-doc", "Abstract": "Human fungal infections represent a growing threat to global public health and are responsible for approximately 1.6 million deaths each year. Azole antifungals remain among the most widely used treatments. They target the ER-located membrane protein CYP51, a lanosterol demethylase involved in the ergosterol synthesis pathway. Azole binding on CYP51 disrupts ergosterol biosynthesis and alters the membrane composition, with a reduction of ergosterol content, effectively regulating fungal cell population. The main resistance mechanism against azoles is the overexpression of the Cdr1 efflux pump that expels azoles from the fungus, thus decreasing their intracellular concentration. In this context, we evaluated a new generation of azole compounds designed with two key properties: (1) to maintain their antifungal efficacy against CYP51, and (2) to inhibit Cdr1-mediated efflux, as a promising strategy to better overcome antifungal resistance. We found the most potent compound, ACH-I-7, with strong broad-spectrum antifungal activity, surpassing that of clinically used azoles. We solved the cryo-EM structure of Candida glabrata Cdr1 with ACH-I-7 and with the inhibitor FK506, which deepens our understanding of azole-drug efflux. Collectively, these findings uncovered new avenues for antifungal discovery and established a structure-guided framework for the rational development of improved inhibitors.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "TEMPERATURE-DEPENDENT NANOSCALE CONFORMATIONS OF MECHANOSENSITIVE PROTEIN BMRa", "Presenter": "Kémil BELHADJI", "Sex": "Male", "Presenter Affiliation": "Institute Curie, CNRS, Physics of Cells and Cancer", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Membrane proteins are essential for exchanges across the impermeable lipid bilayer and operate by switching between distinct conformational states in response to stimuli such as ligand binding, ATP hydrolysis, or changes in the physical properties of the membrane. Their conformational equilibria are therefore highly sensitive to temperature and membrane mechanics. We focus on BmrA, a bacterial ABC transporter that alternates between inward- and outward-facing conformations during its ATP hydrolysis cycle. Biochemical ensemble measurements revealed that the ATPase activity of BmrA increases exponentially with temperature, suggesting a temperature-dependent shift in its conformational equilibrium. Using single-molecule fluorescence resonance energy transfer (FRET) on membrane-reconstituted BmrA proteins, we demonstrate the mechanosensitivity and temperature-dependent remodeling of the conformational landscape of BmrA. We extract the transition rates between the major functional states and determine how thermal energy modulates the kinetics of conformational switching. This approach provides fundamental insight into the biophysics of membrane protein dynamics and clarifies the role of temperature and membrane mechanics in regulating the functions of transporter proteins.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "THE ESSENTIAL LIPOPROTEIN MATURATION ENZYME LGT IS REQUIRED FOR FLAGELLAR AND MEMBRANE INTEGRITY IN HELICOBACTER PYLORI", "Presenter": "Tristan RUFFIOT", "Sex": "Male", "Presenter Affiliation": "", "Presenter Country": "", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Lipoproteins play an important role in physiology and virulence of bacteria. They are characterized by their lipid anchor allowing them to attach to the phospholipid membranes. The first step in lipoprotein maturation is catalyzed by the essential inner-membrane integral protein Lgt that transfers a diacylglyceryl group from phosphatidyglycerol to pre-pro-lipoproteins. Lgt is conserved in bacteria, absent in eukaryotes, and its membrane orientation provides access to small molecule inhibitors. We hypothesize that Lgt is an interesting target for the development of antibiotics. We confirmed the essentiality of Lgt on growth, viability, and morphology of H. pylori using a Lgt depletion strain, where lgt is expressed from a regulated cagUT promoter from a neutral locus on the chromosome. Depletion of Lgt leads to an aberrant cell morphology: round, large cells with bulges and mislocalized flagella are observed by scanning electron microscopy. Interestingly, under prolonged depletion conditions, cells compensate for the lack of Lgt and cells are able to regrow. These so-called revertants adapt a rod cell shape but are shorter than wild-type cells. Transcriptome analyses showed that expression of two phospholipid biosynthesis genes and several flagellar genes are affected in the revertants, while lgt expression levels are slightly lower than wild type. Transmission electron microscopy revealed a reduced number of polar flagella with a disorganized flagellar sheath; however, cells are still motile as demonstrated by video microscopy and single-cell tracking. Phospholipid analyses showed an increase in cardiolipin and decrease in phosphatidylglycerol during Lgt depletion, which was partially restored in the revertants. Together, our data reveal that absence of lipoprotein maturation leads to an envelope stress response that translates into adaptation of membrane and flagellar integrity and motility.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "THE INTERPLAY BETWEEN OMPLA AND MEMBRANE ASYMMETRY", "Presenter": "Jackson CROWLEY", "Sex": "Male", "Presenter Affiliation": "CEITEC – Central European Institute of Technology – Masaryk University", "Presenter Country": "Czech Republic", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Membrane asymmetry affects not only bilayer properties but also the behavior of embedded proteins. The activity of bacterial outer membrane protein LA (OmpLA), for instance, has been linked to differential stress across the leaflets of asymmetric membranes. Conversely, membrane proteins such as OmpLA are known to modulate the properties of symmetric membranes, notably through local thickness deformations. How these two effects interact—asymmetry shaping protein behavior, and protein presence reshaping membrane asymmetry—remains poorly understood. To investigate this interplay, we performed atomistic MD simulations of OmpLA in four membrane compositions matching our experimental system: binary mixtures of a donor lipid (POPC or POPE) and an acceptor lipid (POPG or POPS). Each composition was simulated symmetrically and in two asymmetric configurations, corresponding to the two possible protein orientations arising during preparation of asymmetric large unilamellar vesicles (aLUVs). Comparison with protein-free counterparts allows us to assess how OmpLA alters membrane properties under symmetric versus asymmetric conditions, and how asymmetry in turn affects the local environment around the protein. We present preliminary results from these simulations, alongside practical considerations that arose during setup, including challenges in constructing stable asymmetric bilayers and complications from using protein structures solved at cryogenic temperature.", "Deadline": "Round 2", "Decision": "Poster", "Session": ""}, {"Title": "THE PHOSPHOLIPID RESEARCH CENTER: ADVANCING PHOSPHOLIPID SCIENCE FROM BIOMEMBRANES TO PHARMACEUTICAL RESEARCH", "Presenter": "Simon DRESCHER", "Sex": "Male", "Presenter Affiliation": "Phospholipid Research Center", "Presenter Country": "Germany", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "Phospholipids are essential components of biological membranes and play a central role in membrane structure, dynamics, organization, and function. Their physicochemical diversity, self-assembly behavior, and interactions with proteins, drugs, and other amphiphilic molecules make them highly relevant to both fundamental biomembrane science and pharmaceutical research. This short introductory lecture will present the Phospholipid Research Center (PRC), an independent non-profit organization that supports scientific and technological research on phospholipids. Since 2006, the PRC has funded academic projects worldwide, particularly at the doctoral and postdoctoral level. While the PRC’s main focus is on pharmaceutical and biomedical applications of phospholipids, including formulation science, lipid-based drug delivery systems, excipient functionality, and related technologies, selected projects also address more fundamental aspects of phospholipid behavior in biological and biomimetic membrane systems. The presentation will briefly outline the PRC’s mission, activities, and funding opportunities. By supporting excellent research and fostering exchange between academia and industry, the PRC aims to advance phospholipid science and contribute to a deeper understanding of phospholipids in natural and engineered membrane systems.", "Deadline": "Round 1", "Decision": "Oral", "Session": ""}, {"Title": "THE TRANSPORT ACTIVITY OF PTCH1 IN HEDGEHOG SIGNALING REGULATION AND IN CHEMOTHERAPY RESISTANCE OF CANCER CELLS", "Presenter": "Isabelle MUS-VETEAU", "Sex": "Female", "Presenter Affiliation": "Institut de Pharmacologie Moléculaire et Cellulaire, Université Côte d’Azur, CNRS-UMR7275", "Presenter Country": "France", "Presenter Email": "mus-veteau@ipmc.cnrs.fr", "Presentation Requested": "Oral", "Employment": "Unknown", "Abstract": "PTCH1 is a 12 transmembrane helices protein from the RND efflux pumps which regulates the GPCR Smoothened and the Hedgehog signaling by transporting cholesterol. PTCH1 is overexpressed in many recurrent and metastatic cancers. We showed that PTCH1 pumps chemotherapeutic agents such as doxorubicin out of cancer cells using the proton motive force like the other RND transporters, and contributes to chemotherapy resistance of several cancer cell types. We identified a small molecule which inhibits the doxorubicin efflux activity of PTCH1 and enhances its cytotoxicity in different cancer cell lines endogenously overexpressing PTCH1 and thereby mitigates the resistance of these cancer cells to doxorubicin. This molecule, panicein A hydroquinone (PAH), was first extracted from marine sponges and then chemically synthesized to develop a drug candidate. We recently showed that an optimized derivative of PAH enhances the efficacy of kinase inhibitors such as vemurafenib against melanoma cells resistant to the treatment in cellulo and in vivo. Data obtained from microscale thermophoresis, in silico docking and molecular dynamics, and using a fluorescent derivative of PAH strongly support that this drug efflux inhibitor interacts directly with PTCH1 and allowed proposing its inhibition mechanism. Altogether, our data suggest that the use of inhibitors of PTCH1 drug efflux in combination with chemotherapy could be a promising therapeutic option to improve chemotherapy efficiency against cancer cells expressing PTCH1.", "Deadline": "Round 1", "Decision": "Discuss", "Session": ""}, {"Title": "THE ZINC-FINGER STRUCTURE OF THE CYTOSOLIC DOMAIN OF THE CCHFV Gn PROTEIN IS CONSERVED IN ITS MEMBRANE-BOUND FORM", "Presenter": "Morgane CALLON", "Sex": "Female", "Presenter Affiliation": "Molecular Microbiology and Structural Biochemistry (MMSB) UMR 5086 CNRS/Université de Lyon", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Poster", "Employment": "PhD student", "Abstract": "Here we characterize the structure of the cytosolic domain of the Crimean-Congo hemorrhagic fever virus (CCHFV) Gn protein in its membrane-bound form. CCHFV is emerging in Europe, as its main vector, the Hyalomma tick, is spreading northward due to global warming. With a case fatality rate of up to 40%, CCHFV is one of the deadliest viruses. Despite this, there is no approved vaccine or treatment. The Gn protein is crucial for viral RNA packaging upon assembly. The structure of its isolated cytosolic domain is known; it features a zinc finger, but the membrane-bound form remains uncharacterized. We aim to elucidate the structure of the membrane-bound state using a synergistic combination of cell-free protein synthesis (CFPS) and solid-state NMR, ideal for membrane-associated domains not accessible by cryo-EM. To overcome challenges of membrane protein expression, \"divide-and-conquer\" strategies are commonly used to study soluble domains. However, the membrane environment can significantly influence protein structure and dynamics. CFPS is highly effective at producing membrane proteins in their native form and enables selective isotope labeling, which provides spectral resolution. Our results show that the characteristic zinc-finger motif, previously identified in isolation, is conserved in the membrane-bound form. They also suggest the existence of two conformational states, indicating either a partially asymmetric multimer or a second distinct conformation.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "THEORETICAL AND EXPERIMENTAL APPROACHES TO STUDY TSPO1 INVOLVEMENT IN ERYTHROPOIESIS AND CHOLESTEROL TRANSLOCATION", "Presenter": "Amina BASHEER", "Sex": "Female", "Presenter Affiliation": "Université Paris Cité, Dynamique des Structures et Interactions des Macromolécules Biologiques (DSIMB), UMRS_1134", "Presenter Country": "France", "Presenter Email": "julien.diharce@inserm.fr", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "The translocator protein (TSPO) is an outer mitochondrial membrane protein. In mammals, in addition to cholesterol translocation, TSPO is involved in various important functions such as apoptosis, steroidogenesis, porphyrin transport, and heme biosynthesis. TSPO1 is supposed to form complexes with many proteins such as voltage-dependent anion channels (VDAC) to import cholesterol within mitochondria. However, its function in erythroid cells is still unclear. In TSPO, the most common polymorphism is rs6971, which is the substitution of Alanine to Threonine at position 147 (A147T). Moreover, A147T polymorphism is reported to impact radioligand binding affinity and biological functions, especially neurosteroid biosynthesis. Therefore, the present study is structured around two parallel objectives: to computationally study the impact of the A147T polymorphism on cholesterol translocation and to experimentally identify the protein partners and oligomeric states of human TSPO1 (hTSPO1) in erythroid cells. To accomplish the first objective, all-atom molecular dynamics (MD) simulations of hTSPO1 were performed in a DOPC membrane environment, complemented with 14% cholesterol concentration in long timescales. Two simulation systems were prepared to characterize the variants' impact from polymorphism: the wild-type (A147) and the mutant (T147) forms of hTSPO1, allowing comparative analysis resulting from this mutation. Our findings suggest the transmembrane architecture remained preserved in both variants, indicating the maintenance of the global fold of the protein. However, differences in cavity volume and small conformational changes were observed. Additionally, the A147 variant showed more frequent cholesterol contacts, and the mutation also shifted the cholesterol binding preferences from TM2 to TM3. The cholesterol flip-flop events were more dominant in the A147 variant, mainly occurring via some polar contacts with cholesterol-binding motifs at TM5.", "Deadline": "Round 1", "Decision": "Oral", "Session": "Delemotte"}, {"Title": "TOLC CRYOEM STRUCTURE IN OUTER MEMBRANE VESICLES: A NATIVE CRYO-EM APPROACH", "Presenter": "Florent BEGUIN", "Sex": "Male", "Presenter Affiliation": "Institut de Biologie Physico-Chimique, Laboratoire de Biochimie des Protéines Membranaires (UMR7099)", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "Membrane proteins represent a major challenge in structural and functional biology due to their hydrophobic nature, which complicates both their production and purification. Conventional approaches rely on detergent-based extraction, which can compromise protein stability and consequently alter native structure and function. To overcome these limitations, we developed a more native approach using outer membrane vesicles (OMVs) directly produced by outer membrane budding of E. coli C43, bypassing the need for detergent solubilization entirely. Our study focuses on AcrAB-TolC, a tripartite efflux pump responsible for multidrug resistance in Gram-negative bacteria and one of the most extensively characterized efflux systems, making it an ideal benchmark for validating new methodologies. As a first step, we characterized TolC in isolation—the outer membrane channel component of the complex responsible for drug efflux across the outer membrane. Cryo-EM analysis of TolC reconstituted within OMVs revealed the protein in both open and closed conformations, a striking observation given that TolC has previously only been resolved in its closed state when purified in detergent and in the absence of its complex partners.", "Deadline": "Round 1", "Decision": "Oral", "Session": "van der Goot"}, {"Title": "UNCOUPLING MYELIN MEMBRANE COMPOSITION FROM TISSUE MECHANICS: CONSEQUENCES OF SCHWANN-CELL-SPECIFIC LXRβ DELETION", "Presenter": "Tatiana El Jalkh", "Sex": "Female", "Presenter Affiliation": "Université Paris Cité, INSERM U1124 (T3S)", "Presenter Country": "France", "Presenter Email": "", "Presentation Requested": "", "Employment": "Unknown", "Abstract": "The myelin sheath of the peripheral nervous system is among the most lipid-rich biomembranes in the body: ~70% of its dry mass is lipid, dominated by cholesterol and sphingolipids, and organized into a compact multilamellar structure through the repeated wrapping of Schwann cell plasma membranes. How the lipid composition of this membrane is sensed and maintained, and how composition couples to the mechanical integrity of the nerve, remain open questions at the interface of membrane biophysics and cell biology. Liver X Receptor β (LXRβ) is a cholesterol-oxysterol-sensing nuclear receptor that governs cholesterol homeostasis, lipogenesis, and lipid efflux. We generated a Schwann-cell-specific LXRβ knockout mouse (Dhh:Cre; LXRβfl/fl) to ask how the loss of a membrane-lipid sensor reshapes the myelin membrane, its composition, and its mechanics. Schwann-cell LXRβ ablation resulted in a near-complete absence of myelination from early embryonic stages, progressing to total Schwann cell loss in adulthood, accompanied by profound depletion of myelinated axons and severely impaired nerve conduction. Chemical imaging by Time-of-Flight Secondary Ion Mass Spectrometry (ToF-SIMS) revealed a dramatic collapse of nerve cholesterol, mirrored by downregulation of the biosynthetic machinery (HMGCR, SREBP2) and compensatory upregulation of the efflux effectors ABCA1 and ApoE. Strikingly, sphingomyelin was enriched rather than depleted, indicating an active remodeling of the residual membrane lipidome. Nanomechanical mapping of intact nerve fibers by Atomic Force Microscopy (AFM) uncovered a counterintuitive result: despite near-absent myelin, fiber elasticity (Young's modulus) was preserved. This mechanical rescue was accompanied by increased collagen deposition, increased number of endoneurial fibroblast-like cells, and infiltration of perineurial cells that structurally re-scaffold the endoneurium.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "UNVEILING ANTIMICROBIAL PEPTIDE INTERACTIONS: FROM VESICLES TO LIVING CELLS VIA QUANTITATIVE SPECTROSCOPIC MEASUREMENTS", "Presenter": "Daniela ROVERSI", "Sex": "Female", "Presenter Affiliation": "Tor Vergata University of Rome, Department of Chemical Science and Technologies", "Presenter Country": "Italy", "Presenter Email": "daniela.roversi@uniroma2.it", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Antimicrobial peptides (AMPs) are promising candidates to combat the global rise of antibiotic-resistant bacteria. The effectiveness of AMPs depends on their affinity for lipid bilayers and their ability to perturb membrane integrity upon binding. Traditionally, their activity and selectivity toward pathogens are assessed using microbiological assays or model vesicles. However, these parameters are typically evaluated in isolated systems containing only a single cell or vesicle type at a time, and peptide membrane affinity, a key determinant of selectivity, is often neglected. Consequently, these models fail to accurately reflect in vivo conditions. Here, we investigate AMP selectivity in mixed environments using model membrane systems designed to better mimic the complex conditions occurring during bacterial infections. In addition, we extend our previously developed method to the quantitative evaluation of AMP–cell interactions in living eukaryotic cells. This approach relies on spectroscopic techniques under experimental conditions closely resembling those of microbiological assays, thereby bridging the gap between biophysical and microbiological studies. We examined peptides binding to a murine macrophage cancer cell line and healthy Chinese hamster ovary (CHO) cells, also employing confocal microscopy to gain deeper insight into the peptide–cell interaction. We demonstrate that AMP interactions with living eukaryotic cells can be quantitatively assessed, thereby elucidating the mechanisms of their selectivity.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}, {"Title": "VDAC2 STABILIZES A MEMBRANE-INSERTED, PRIMED INTERMEDIATE OF BAX ACTIVATION", "Presenter": "Varun RAVISHANKAR", "Sex": "Male", "Presenter Affiliation": "Laboratoire d’Ingénierie des Systèmes Macromoléculaires, LISM, CNRS, UMR7255", "Presenter Country": "France", "Presenter Email": "lbergdoll@imm.cnrs.fr", "Presentation Requested": "Oral", "Employment": "PhD student", "Abstract": "The Bcl-2 associated X protein (BAX) is a major effector of mitochondrial apoptosis implicated in a wide range of cancers. It is activated through a series of conformational transitions that lead to mitochondrial outer membrane permeabilization. Genetic studies have established the mitochondrial porin VDAC2 as an essential regulator of BAX-mediated apoptosis, yet the molecular basis of this regulation remains unresolved. The absence of direct structural and biochemical characterization of VDAC2–BAX interactions has prevented mechanistic understanding of how VDAC2 influences BAX activation. Here, using complementary biochemical, biophysical, and structural approaches, we reconstituted and characterized, for the first time, a stable VDAC2–BAX complex that was not observed with VDAC1, highlighting an isoform-specific role in BAX regulation. We show that VDAC2 captures and stabilizes a primed BAX conformation displaying the hallmarks of BAX activation on mitochondria, including membrane insertion, BH3-domain exposure, and increased disorder of the N-terminal region. By integrating AlphaFold3 predictions with molecular dynamics simulations, biochemical, biophysical, and structural constraints, we derive an experimentally-supported structural model in which BAX is anchored with VDAC2 in lipid nanodiscs through its α9 helix, while its core domain extends flexibly over the VDAC2 pore. Together, our findings support a model in which VDAC2 facilitates BAX membrane insertion and stabilizes a membrane-inserted, activation-competent BAX intermediate.", "Deadline": "Round 1", "Decision": "Oral", "Session": "van der Goot"}, {"Title": "WHAT DRIVES THE POSSIBILITY FOR PFAS TO PERMEATE CELLS: A MD STUDY", "Presenter": "Emmanuelle ORHAN", "Sex": "Female", "Presenter Affiliation": "Pharmacology & Transplantation, UMR INSERM 1248, University of Limoges", "Presenter Country": "France", "Presenter Email": "Emmanuelle.orhan@unilim.fr", "Presentation Requested": "Poster", "Employment": "Unknown", "Abstract": "Per- and polyfluoroalkyl substances (PFAS) constitute a vast family of several thousand chemical compounds. Known for their non-stick, waterproof, and heat-resistant properties, these substances are widely used in textiles, packaging, fire-fighting foams, refrigerants, non-stick coatings, cosmetics, and more. PFAS are associated with various adverse health effects, and it is crucial to better understand how these compounds interact with the human body. In particular, it is important to determine which physicochemical and structural parameters—such as size, charge, and hydrophobicity—influence the ability of PFAS to cross cellular membranes. To address this, we employ molecular dynamics simulations aimed at identifying the factors that affect their passive permeation. The modeling protocol used (MemCross), based on the Accelerated Weight Histogram (AWH) algorithm and previously developed in our laboratory, allows us to track, at the atomic scale, the movements and insertion of the studied molecule into lipid bilayers. In this preliminary study, we selected six perfluorinated acids in carboxylic or sulfonic form, which are frequently detected in drinking water, the primary source of human contamination.", "Deadline": "Round 1", "Decision": "Poster", "Session": ""}, {"Title": "WHEN LABELS LIE: UNEXPECTED OPTICAL FEATURES OF FLUORESCENT LIPID PROBES IN ELECTROFORMED MODEL MEMBRANES", "Presenter": "Aharon STEFFÈ", "Sex": "Male", "Presenter Affiliation": "University of Trieste, Department of Life Sciences", "Presenter Country": "Italy", "Presenter Email": "elena.ambrosetti@units.it", "Presentation Requested": "Oral", "Employment": "Post-doc", "Abstract": "Giant Unilamellar Vesicles (GUVs) are versatile biomimetic systems for investigating membrane biophysics, lipid organization, phase separation, and protein interactions in a cell-like environment. Among the available producing approaches, in this study, we investigated the electroformation of GUVs using microfabricated interdigitated titanium/gold (Ti/Au) electrodes. GUVs were prepared via alternating electric field hydration from a lipid mixture composed of 1,2-dioleoyl-sn-glycero-3-phosphocholine (DOPC) and 1,2-dioleoyl-sn-glycero-3-phosphoethanolamine (DOPE) doped with Atto647N probe. Intriguingly, confocal microscopy imaging and fluorimetric spectral analysis revealed a systematic, previously unreported secondary emission at shorter wavelengths alongside the expected Atto647N signal. Our data suggest that this spurious emission appears to be closely connected to the electroformation process itself, with a probable involvement of reactive oxygen species (ROS), and strictly modulated by the specific composition of the electrode material. In more detail, the phenomenon is likely driven by electrochemical processes and/or altered lipid-probe interactions within the vesicle membrane. Overall, these results emphasize the importance of rigorous spectral validation, while highlighting critical considerations for accurate multichannel imaging in model membrane systems.", "Deadline": "Round 2", "Decision": "Discuss", "Session": ""}];

const listEl = document.getElementById('cardList');
const emptyEl = document.getElementById('emptyState');
const countEl = document.getElementById('resultCount');
const totalEl = document.getElementById('totalCount');
const searchInput = document.getElementById('searchInput');
const filterSex = document.getElementById('filterSex');
const filterType = document.getElementById('filterType');
const filterStatus = document.getElementById('filterStatus');
const filterCountry = document.getElementById('filterCountry');
const filterDeadline = document.getElementById('filterDeadline');
const filterDecision = document.getElementById('filterDecision');
const filterSession = document.getElementById('filterSession');
const clearBtn = document.getElementById('clearFilters');

function uniqueSorted(arr){
  return [...new Set(arr.filter(v => v !== undefined && v !== null && String(v).trim() !== ''))].sort((a,b)=>String(a).localeCompare(String(b)));
}

function populateSelect(selectEl, values, label){
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

populateSelect(filterSex, uniqueSorted(ABSTRACTS.map(a => a['Sex'])));
populateSelect(filterType, uniqueSorted(ABSTRACTS.map(a => a['Presentation Requested'])));
populateSelect(filterStatus, uniqueSorted(ABSTRACTS.map(a => a['Employment'])));
populateSelect(filterCountry, uniqueSorted(ABSTRACTS.map(a => a['Presenter Country'])));
populateSelect(filterDeadline, uniqueSorted(ABSTRACTS.map(a => a['Deadline'])));
populateSelect(filterDecision, uniqueSorted(ABSTRACTS.map(a => a['Decision'])));
populateSelect(filterSession, uniqueSorted(ABSTRACTS.map(a => a['Session'])));

totalEl.textContent = ABSTRACTS.length;

function sexClass(sex){
  if(!sex) return '';
  const s = String(sex).toLowerCase();
  if(s === 'female') return 'female';
  if(s === 'male') return 'male';
  return '';
}

function renderCard(item, index){
  const card = document.createElement('article');
  card.className = 'card';

  const head = document.createElement('button');
  head.className = 'card-head';
  head.setAttribute('aria-expanded', 'false');

  const affiliationLine = [item['Presenter Affiliation'], item['Presenter Country']].filter(Boolean).join(' · ');

  head.innerHTML = `
    <span class="toggle-icon" aria-hidden="true">▶</span>
    <span class="card-main">
      <span class="card-num">Submission ${index + 1}${item['Deadline'] ? ' · ' + item['Deadline'] : ''}</span>
      <h2 class="card-title">${item['Title'] || 'Untitled abstract'}</h2>
      <p class="card-meta"><span class="presenter-name">${item['Presenter'] || 'Unknown presenter'}</span>${affiliationLine ? ' — ' + affiliationLine : ''}</p>
    </span>
    <span class="tags">
      ${item['Sex'] ? `<span class="tag tag-sex ${sexClass(item['Sex'])}">${item['Sex']}</span>` : ''}
      ${item['Employment'] ? `<span class="tag tag-status">${item['Employment']}</span>` : ''}
      ${item['Presentation Requested'] ? `<span class="tag tag-type">Requested: ${item['Presentation Requested']}</span>` : ''}
      ${item['Decision'] ? `<span class="tag tag-decision decision-${item['Decision'].toLowerCase()}">Decision: ${item['Decision']}</span>` : ''}
      ${item['Session'] ? `<span class="tag tag-session">Session: ${item['Session']}</span>` : ''}
    </span>
  `;

  const abstractWrap = document.createElement('div');
  abstractWrap.className = 'abstract';
  abstractWrap.innerHTML = `
    <div class="abstract-inner">
      <div class="abstract-body">
        <p>${item['Abstract'] || 'No abstract text provided.'}</p>
        <div class="extra-meta">
          ${item['Presenter Email'] ? `<span>Email: ${item['Presenter Email']}</span>` : ''}
        </div>
      </div>
    </div>
  `;

  head.addEventListener('click', () => {
    const isOpen = card.classList.toggle('open');
    head.setAttribute('aria-expanded', String(isOpen));
  });

  card.appendChild(head);
  card.appendChild(abstractWrap);
  return card;
}

function applyFilters(){
  listEl.innerHTML = '';
  const active = filterConfigs.filter(f => f.get());
  const filtered = ABSTRACTS.filter(item => matchesAll(item, null));

  if(filtered.length === 0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    filtered.forEach(item => listEl.appendChild(renderCard(item, ABSTRACTS.indexOf(item))));
  }

  // Denominator: how many abstracts matched just before the most recently
  // changed filter was applied — i.e. matching every *other* active filter.
  // This is what lets "male" + "discuss" read as "21 of 38" (38 = discuss
  // alone) rather than "21 of 105" (the whole dataset).
  let denominator;
  if(lastChangedKey && active.some(f => f.key === lastChangedKey)){
    denominator = ABSTRACTS.filter(item => matchesAll(item, lastChangedKey)).length;
  } else if(active.length === 0){
    denominator = ABSTRACTS.length;
  } else {
    denominator = ABSTRACTS.filter(item => matchesAll(item, null)).length;
  }

  countEl.textContent = `${filtered.length} of ${denominator} abstracts`;
}

function matchesAll(item, excludeKey){
  return filterConfigs.every(f => {
    if(f.key === excludeKey) return true;
    const val = f.get();
    if(!val) return true;
    return f.test(item, val);
  });
}

let lastChangedKey = null;

const filterConfigs = [
  { key:'search', get:() => searchInput.value.trim().toLowerCase(),
    test:(item, q) => [item['Title'], item['Presenter'], item['Presenter Affiliation'], item['Abstract']]
      .filter(Boolean).join(' ').toLowerCase().includes(q) },
  { key:'sex', get:() => filterSex.value, test:(item,v) => item['Sex'] === v },
  { key:'type', get:() => filterType.value, test:(item,v) => item['Presentation Requested'] === v },
  { key:'employment', get:() => filterStatus.value, test:(item,v) => item['Employment'] === v },
  { key:'country', get:() => filterCountry.value, test:(item,v) => item['Presenter Country'] === v },
  { key:'deadline', get:() => filterDeadline.value, test:(item,v) => item['Deadline'] === v },
  { key:'decision', get:() => filterDecision.value, test:(item,v) => item['Decision'] === v },
  { key:'session', get:() => filterSession.value, test:(item,v) => item['Session'] === v },
];

[
  [searchInput, 'search'], [filterSex, 'sex'], [filterType, 'type'],
  [filterStatus, 'employment'], [filterCountry, 'country'],
  [filterDeadline, 'deadline'], [filterDecision, 'decision'], [filterSession, 'session']
].forEach(([el, key]) => {
  el.addEventListener('input', () => { lastChangedKey = key; applyFilters(); });
  el.addEventListener('change', () => { lastChangedKey = key; applyFilters(); });
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  filterSex.value = '';
  filterType.value = '';
  filterStatus.value = '';
  filterCountry.value = '';
  filterDeadline.value = '';
  filterDecision.value = '';
  filterSession.value = '';
  lastChangedKey = null;
  applyFilters();
});

applyFilters();
</script>

</body>
</html>
